<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pasar lista · Vida en Arte 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--negro:#000;--texto:#1c1c1c;--gris:#6b6f76;--gris2:#9aa0a6;--linea:#e3e5ea;--fondo:#f5f6f8;--blanco:#fff;
  --azul-marca:#2e5aa8;--naranja:#f5a11c;--rojo:#d9261c;--verde:#1f9d55;
  --presente:#1f9d55;--tarde:#e08a00;--ausente:#d9261c;--justificada:#5a45b5;
  --ok-fondo:#e6f5ec;--mal-fondo:#fdecea;--ojo-fondo:#fff6e0}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--texto);font-size:16px;line-height:1.4;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:var(--blanco);border-bottom:1px solid var(--linea);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.barra{display:flex;gap:12px;align-items:center;justify-content:space-between;max-width:900px;margin:0 auto}
.quien{font-size:20px;font-weight:700;line-height:1.2}
.quien small{display:block;font-size:13px;font-weight:500;color:var(--gris)}
.salir{font:inherit;font-weight:700;font-size:17px;min-height:52px;padding:0 22px;border-radius:14px;border:2px solid var(--rojo);color:var(--rojo);background:var(--blanco);text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap}
.salir:active{background:var(--mal-fondo)}
main{max-width:900px;margin:0 auto;padding:16px}
.fecha-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.fecha-bar input{font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--linea);border-radius:12px;min-height:52px}
.fecha-bar a{color:var(--gris);font-size:14px}
h1{font-size:22px;margin-bottom:12px}
.aviso{font-size:15px;padding:12px 14px;border-radius:12px;margin-bottom:12px}
.aviso.mal{background:var(--mal-fondo);color:#a3160f}.aviso.ok{background:var(--ok-fondo);color:#17804a}.aviso.ojo{background:var(--ojo-fondo);color:#7a5200}
.clases{display:grid;gap:12px}
.clase{display:flex;gap:14px;align-items:center;width:100%;text-align:left;font:inherit;background:var(--blanco);border:2px solid var(--linea);border-radius:16px;padding:16px;cursor:pointer;min-height:84px}
.clase:active{border-color:var(--azul-marca)}
.clase .hora{font-size:24px;font-weight:700;min-width:78px}
.clase .que{flex:1}
.clase .que b{display:block;font-size:19px}
.clase .que span{color:var(--gris);font-size:14px}
.estado-lista{font-size:14px;font-weight:600;padding:6px 10px;border-radius:999px;white-space:nowrap}
.estado-lista.hecha{background:var(--ok-fondo);color:#17804a}.estado-lista.falta{background:var(--ojo-fondo);color:#7a5200}.estado-lista.sin{background:var(--fondo);color:var(--gris)}
.volver{font:inherit;font-weight:600;font-size:16px;background:none;border:0;color:var(--azul-marca);padding:10px 0;min-height:48px;cursor:pointer}
.tit-clase{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.todos{font:inherit;font-weight:600;font-size:16px;min-height:52px;padding:0 18px;border-radius:14px;border:2px solid var(--presente);color:var(--presente);background:var(--blanco);cursor:pointer}
.nino{background:var(--blanco);border:1px solid var(--linea);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.nino .nom{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.nino .nom b{font-size:19px}
.nino .nom .edad{color:var(--gris);font-size:15px}
.marca{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--ojo-fondo);color:#7a5200}
.marca.Prueba{background:#e3ecfb;color:#1f4f9a}.marca.Reposición{background:var(--ok-fondo);color:#17804a}.marca.Eventual{background:var(--ojo-fondo);color:#7a5200}.marca.fuera{background:#efe9fb;color:#4a3699}
.botones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.botones button{font:inherit;font-weight:700;font-size:16px;min-height:60px;border-radius:14px;border:2px solid var(--linea);background:var(--blanco);color:var(--texto);cursor:pointer;padding:4px}
.botones button[aria-pressed=true][data-e="Presente"]{background:var(--presente);border-color:var(--presente);color:#fff}
.botones button[aria-pressed=true][data-e="Llegó tarde"]{background:var(--tarde);border-color:var(--tarde);color:#fff}
.botones button[aria-pressed=true][data-e="Ausente"]{background:var(--ausente);border-color:var(--ausente);color:#fff}
.botones button[aria-pressed=true][data-e="Falta justificada"]{background:var(--justificada);border-color:var(--justificada);color:#fff}
.fuera-form{display:flex;gap:8px;margin:14px 0}
.fuera-form input{flex:1;font:inherit;font-size:17px;padding:12px;border:1px solid var(--linea);border-radius:12px;min-height:56px}
.fuera-form button{font:inherit;font-weight:700;font-size:16px;min-height:56px;padding:0 16px;border-radius:12px;border:2px solid var(--azul-marca);color:var(--azul-marca);background:var(--blanco);cursor:pointer}
.pie{position:fixed;left:0;right:0;bottom:0;background:var(--blanco);border-top:1px solid var(--linea);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.pie .dentro{max-width:900px;margin:0 auto;display:flex;gap:12px;align-items:center}
.pie .cuenta{flex:1;font-size:15px;color:var(--gris)}
.guardar{font:inherit;font-weight:700;font-size:19px;min-height:64px;padding:0 28px;border-radius:16px;border:0;background:var(--azul-marca);color:#fff;cursor:pointer}
.guardar:disabled{opacity:.5}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--naranja);outline-offset:2px}
.oculto{display:none!important}
@media (max-width:560px){.botones{grid-template-columns:repeat(2,1fr)}.quien{font-size:17px}.salir{padding:0 14px}}
</style>
</head>
<body>
<header>
  <div class="barra">
    <div class="quien" id="quien">Pasando lista<small>Vida en Arte · After School</small></div>
    <a class="salir" href="/logout.php">Salir</a>
  </div>
</header>

<main>
  <div class="fecha-bar oculto" id="fechaBar">
    <label for="fecha">Día</label><input type="date" id="fecha">
    <a href="/">Portal</a><a href="/after-school/">After School</a>
  </div>
  <div id="avisos"></div>
  <section id="vClases">
    <h1 id="titDia">Clases de hoy</h1>
    <div class="clases" id="clases"><p>Cargando…</p></div>
  </section>
  <section id="vLista" class="oculto">
    <button class="volver" id="volver" type="button">‹ Todas las clases</button>
    <div class="tit-clase"><h1 id="titClase"></h1><button class="todos" id="todos" type="button">Los que faltan: Presente</button></div>
    <div id="ninos"></div>
    <div class="fuera-form">
      <input type="text" id="fueraNombre" placeholder="Niño que no está en la lista" autocomplete="off">
      <button id="fueraAgregar" type="button">Agregar</button>
    </div>
  </section>
</main>

<div class="pie oculto" id="pie">
  <div class="dentro"><span class="cuenta" id="cuenta"></span><button class="guardar" id="guardar" type="button">Guardar lista</button></div>
</div>

<!-- Quién está conectado (lo dice el servidor). -->
<script src="/acceso.php"></script>
<script>
'use strict';
/* Pasar lista (21-oct). Habla solo con pasar-lista/api.php, que decide si se
   puede otro día y recorta todo menos nombre, edad y la marca de visita.
   Cada guardado lleva un ID de solicitud: si la respuesta se pierde y se
   vuelve a guardar lo mismo, el servidor no lo repite. */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ESTADOS = [['Presente', 'Presente'], ['Llegó tarde', 'Tarde'], ['Ausente', 'Ausente'], ['Falta justificada', 'Justificada']];
const fechaLarga = iso => { const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' }); };

let L = null;            // la respuesta de leerLista
let actual = null;       // la clase abierta
let marcas = {};         // idNino → estado (lo que hay en pantalla)
let fuera = [];          // [{idAsistencia?, nombre, estado}]
let cambios = false;
let puedeOtroDia = false;
const params = new URLSearchParams(location.search);

if (window.PORTAL && window.PORTAL.usuario) $('#quien').innerHTML = 'Pasando lista: ' + esc(window.PORTAL.usuario) + '<small>Vida en Arte · After School</small>';

async function api(accion, datos, idSolicitud) {
  const cuerpo = { accion, datos: datos || {} };
  if (idSolicitud) cuerpo.idSolicitud = idSolicitud;
  let r;
  try { r = await fetch('api.php', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(cuerpo) }); }
  catch (e) { throw Object.assign(new Error('No hay conexión. Revisa el wifi y vuelve a intentarlo.'), { codigo: 'red' }); }
  const txt = await r.text();
  if (/^\s*</.test(txt)) {
    if (r.status >= 500) throw Object.assign(new Error('El servidor no respondió bien (código ' + r.status + ').'), { codigo: 'incierto' });
    location.href = '/login.php?r=' + encodeURIComponent('/pasar-lista/');
    throw new Error('La sesión se cerró.');
  }
  let j; try { j = JSON.parse(txt); } catch (e) { throw Object.assign(new Error('Respuesta ilegible (código ' + r.status + ').'), { codigo: 'incierto' }); }
  if (j.codigo === 'cambiar_clave') { location.href = '/cambiar-clave.php?r=' + encodeURIComponent('/pasar-lista/'); throw new Error('Cambia tu contraseña.'); }
  if (j.permisos) puedeOtroDia = !!j.permisos.puedeOtroDia;
  if (!j.ok) throw Object.assign(new Error(j.error || 'Error ' + r.status), { codigo: j.codigo || '' });
  return j;
}

function aviso(html, tipo) { $('#avisos').innerHTML = html ? '<div class="aviso ' + (tipo || 'mal') + '">' + html + '</div>' : ''; }

async function cargar(fecha) {
  $('#clases').innerHTML = '<p>Cargando…</p>';
  try {
    L = (await api('leerLista', fecha ? { fecha } : {})).resultado;
  } catch (e) { $('#clases').innerHTML = ''; aviso(esc(e.message)); return; }
  aviso('');
  $('#fechaBar').classList.toggle('oculto', !puedeOtroDia);
  $('#fecha').value = L.fecha; $('#fecha').max = L.hoy;
  $('#titDia').textContent = (L.fecha === L.hoy ? 'Clases de hoy · ' : 'Clases del ') + fechaLarga(L.fecha);
  pintarClases();
  const pedida = params.get('clase');
  if (pedida && L.clases.some(c => c.codigo === pedida)) { params.delete('clase'); abrir(pedida); }
}

function pintarClases() {
  $('#vClases').classList.remove('oculto'); $('#vLista').classList.add('oculto'); $('#pie').classList.add('oculto');
  if (!L.clases.length) { $('#clases').innerHTML = '<div class="aviso ojo">No hay clases este día.</div>'; return; }
  $('#clases').innerHTML = L.clases.map(c => {
    const n = c.ninos.length + c.fueraDeLista.length;
    const est = c.sinClase ? '<span class="estado-lista sin">No hubo clase</span>' : c.guardada ? '<span class="estado-lista hecha">✓ Lista guardada</span>' : '<span class="estado-lista falta">Sin pasar</span>';
    return '<button class="clase" type="button" data-c="' + esc(c.codigo) + '"' + (c.sinClase ? ' disabled' : '') + '><span class="hora">' + esc(c.hora) + '</span>' +
      '<span class="que"><b>' + esc(c.servicio) + '</b><span>' + n + (n === 1 ? ' niño' : ' niños') + '</span></span>' + est + '</button>';
  }).join('');
  $('#clases').querySelectorAll('[data-c]').forEach(b => b.onclick = () => abrir(b.dataset.c));
}

function abrir(codigo) {
  actual = L.clases.find(c => c.codigo === codigo);
  if (!actual) return;
  marcas = {}; fuera = []; cambios = false;
  actual.ninos.forEach(n => { if (n.estado) marcas[n.idNino] = n.estado; });
  actual.fueraDeLista.forEach(f => fuera.push({ idAsistencia: f.idAsistencia, nombre: f.nombre, estado: f.estado }));
  $('#titClase').textContent = actual.servicio + ' · ' + actual.hora;
  $('#vClases').classList.add('oculto'); $('#vLista').classList.remove('oculto'); $('#pie').classList.remove('oculto');
  aviso('');
  pintarLista();
  window.scrollTo(0, 0);
}

function botones(clave, estado) {
  return '<div class="botones" role="group">' + ESTADOS.map(([e, t]) =>
    '<button type="button" data-k="' + esc(clave) + '" data-e="' + esc(e) + '" aria-pressed="' + (estado === e) + '">' + t + '</button>').join('') + '</div>';
}

function pintarLista() {
  const filas = actual.ninos.map(n => '<div class="nino"><div class="nom"><b>' + esc(n.nombre) + '</b>' + (n.edad ? '<span class="edad">' + esc(n.edad) + '</span>' : '') +
      (n.presencia !== 'Inscrito' ? '<span class="marca ' + esc(n.presencia) + '">' + esc(n.presencia) + '</span>' : '') + '</div>' +
      botones('n:' + n.idNino, marcas[n.idNino]) + '</div>').join('') +
    fuera.map((f, i) => '<div class="nino"><div class="nom"><b>' + esc(f.nombre) + '</b><span class="marca fuera">Fuera de lista</span></div>' + botones('f:' + i, f.estado) + '</div>').join('');
  $('#ninos').innerHTML = filas || '<div class="aviso ojo">Esta clase no tiene niños hoy. Si vino alguien, agrégalo abajo.</div>';
  $('#ninos').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k.startsWith('n:')) marcas[k.slice(2)] = b.dataset.e; else fuera[+k.slice(2)].estado = b.dataset.e;
    cambios = true;
    b.parentNode.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    pintarCuenta();
  });
  pintarCuenta();
}

function pintarCuenta() {
  const total = actual.ninos.length + fuera.length;
  const hechos = actual.ninos.filter(n => marcas[n.idNino]).length + fuera.filter(f => f.estado).length;
  const pres = Object.values(marcas).concat(fuera.map(f => f.estado)).filter(e => e === 'Presente' || e === 'Llegó tarde').length;
  $('#cuenta').textContent = hechos + ' de ' + total + ' marcados · ' + pres + ' presentes';
  $('#guardar').disabled = !hechos;
  $('#guardar').textContent = actual.guardada && !cambios ? '✓ Guardada' : 'Guardar lista';
}

$('#todos').onclick = () => {
  actual.ninos.forEach(n => { if (!marcas[n.idNino]) { marcas[n.idNino] = 'Presente'; cambios = true; } });
  fuera.forEach(f => { if (!f.estado) { f.estado = 'Presente'; cambios = true; } });
  pintarLista();
};
$('#fueraAgregar').onclick = () => {
  const nombre = $('#fueraNombre').value.trim();
  if (!nombre) { $('#fueraNombre').focus(); return; }
  fuera.push({ nombre, estado: 'Presente' }); cambios = true;
  $('#fueraNombre').value = '';
  pintarLista();
};
$('#fueraNombre').onkeydown = e => { if (e.key === 'Enter') $('#fueraAgregar').click(); };
$('#volver').onclick = () => {
  if (cambios && !confirm('Hay marcas sin guardar. ¿Volver igual?')) return;
  pintarClases();
};

/* Mismo contenido → mismo ID de solicitud (un reintento no duplica). */
let ultimo = { clave: '', id: '' };
function idPara(clave) {
  if (ultimo.clave === clave) return ultimo.id;
  const id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12));
  ultimo = { clave, id };
  return id;
}

$('#guardar').onclick = async () => {
  const datos = {
    fecha: L.fecha, codigo: actual.codigo,
    marcas: actual.ninos.filter(n => marcas[n.idNino]).map(n => ({ idNino: n.idNino, estado: marcas[n.idNino] })),
    fueraDeLista: fuera.filter(f => f.estado).map(f => f.idAsistencia ? { idAsistencia: f.idAsistencia, nombre: f.nombre, estado: f.estado } : { nombre: f.nombre, estado: f.estado })
  };
  const id = idPara(JSON.stringify(datos));
  $('#guardar').disabled = true; $('#guardar').textContent = 'Guardando…';
  const codigo = actual.codigo;
  try {
    await api('guardarLista', datos, id);
    cambios = false;
    await cargar(L.fecha);
    aviso('Lista guardada: ' + esc(actual ? actual.servicio + ' ' + actual.hora : codigo) + '.', 'ok');
  } catch (e) {
    if (e.codigo === 'incierto' || e.codigo === 'red') {
      aviso('No llegó la respuesta. Toca «Guardar lista» otra vez: si ya se había guardado, no se repite.', 'ojo');
    } else aviso(esc(e.message));
    pintarCuenta();
  }
};

$('#fecha').onchange = () => { if ($('#fecha').value) cargar($('#fecha').value); };
window.addEventListener('beforeunload', e => { if (cambios) { e.preventDefault(); e.returnValue = ''; } });
cargar(params.get('fecha') || '');
</script>
</body>
</html>
