<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vida en Arte 360 · Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --negro: #000000;
    --texto: #1c1c1c;
    --gris: #6b6f76;
    --linea: #e3e5ea;
    --fondo: #f5f6f8;
    --blanco: #ffffff;
    --azul-marca: #2e5aa8;
    --azul: #1e6fa8;
    --naranja: #f5a11c;
    --rojo: #d9261c;
    --verde: #1f9d55;
    --morado: #5a45b5;
    --amarillo: #f8b91e;
    --verde-actio: #004225;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    display: flex;
    min-height: 100vh;
  }

  /* ---------- Barra lateral ---------- */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--azul-marca);
    color: var(--blanco);
    display: flex;
    flex-direction: column;
    padding: 28px 20px;
    position: fixed;
    top: 0;
    left: 0;
    height: 100%;
    overflow-y: auto;
  }
  .brand { display: flex; flex-direction: column; gap: 10px; }
  .logo-box { background: var(--blanco); border-radius: 12px; padding: 12px 14px; }
  .logo-box img { display: block; width: 100%; height: auto; }

  /* En móvil y tablet la franja azul hace de barra: logo, título y salir. */
  .movil-acciones { display: none; align-items: center; gap: 12px; }
  .movil-titulo { font-size: 12px; color: var(--blanco); opacity: .9; white-space: nowrap; }
  .logout.claro { color: var(--blanco); border-color: rgba(255,255,255,.45); }
  .logout.claro:hover { border-color: var(--blanco); color: var(--blanco); background: rgba(255,255,255,.12); }

  .nav { margin-top: 36px; display: flex; flex-direction: column; gap: 4px; }
  .nav a {
    display: flex; align-items: center; gap: 12px;
    color: var(--blanco); text-decoration: none;
    font-size: 14px; font-weight: 500;
    padding: 10px 12px; border-radius: 10px;
    transition: background .15s;
  }
  .nav a:hover { background: rgba(255,255,255,.12); }
  .nav a:focus-visible { outline: 2px solid var(--blanco); outline-offset: 2px; }
  .nav .pip { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .nav a.off { opacity: .55; }

  .sidebar-foot { margin-top: auto; font-size: 12px; opacity: .75; }

  /* ---------- Contenido ---------- */
  .main { flex: 1; min-width: 0; margin-left: 260px; display: flex; flex-direction: column; }
  .topbar {
    background: var(--blanco);
    border-bottom: 1px solid var(--linea);
    padding: 16px 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    font-size: 12px; color: var(--gris);
  }

  .top-actions { display: flex; align-items: center; gap: 12px; }
  .logout {
    font-size: 12px; font-weight: 600; color: var(--texto); text-decoration: none;
    padding: 6px 12px; border: 1px solid var(--linea); border-radius: 999px; white-space: nowrap;
  }
  .logout:hover { border-color: var(--rojo); color: var(--rojo); }
  .logout:focus-visible { outline: 2px solid var(--azul-marca); outline-offset: 2px; }

  .content { width: 100%; max-width: 900px; margin: 0 auto; padding: 48px 24px 64px; }
  h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.8px; color: var(--negro); }
  .sub { margin-top: 6px; font-size: 14px; color: var(--gris); }

  .section-label {
    margin-top: 40px; padding-bottom: 10px;
    border-bottom: 1px solid var(--linea);
    font-size: 11px; font-weight: 700; color: var(--gris); letter-spacing: .6px;
  }

  .pie { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--linea); font-size: 11px; color: var(--gris); text-align: center; }

  .grid {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 16px;
  }
  .card { grid-column: span 2; }

  .card {
    position: relative;
    display: flex; flex-direction: column;
    background: var(--blanco);
    border: 1px solid var(--linea);
    border-radius: 14px;
    padding: 22px 20px 18px;
    text-decoration: none; color: inherit;
    overflow: hidden;
    min-height: 190px;
    transition: border-color .15s, transform .15s;
  }
  .card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: var(--c);
  }
  a.card:hover { border-color: var(--c); transform: translateY(-2px); }
  a.card:focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }
  .card.off { cursor: default; }

  /* Tarjeta ancha: fila entera, en horizontal, la mitad de alta que las demás. */
  .card.ancha {
    grid-column: 1 / -1;
    background: var(--verde-actio);
    border-color: var(--verde-actio);
    display: grid;
    grid-template-columns: auto 1fr auto;
    grid-template-rows: auto auto;
    align-items: center; column-gap: 18px;
    min-height: 0; height: 95px; padding: 0 20px;
  }
  .card.ancha .logo-actio { grid-column: 1; grid-row: 1 / 3; }
  .card.ancha h2 { grid-column: 2; grid-row: 1; align-self: end; margin: 0; }
  .card.ancha p  { grid-column: 2; grid-row: 2; align-self: start; margin-top: 3px; }
  .card.ancha .card-foot { grid-column: 3; grid-row: 1 / 3; margin: 0; padding: 0; gap: 12px; }
  a.card.ancha:hover { border-color: #0a6a3c; }
  .card.ancha h2, .card.ancha p { color: var(--blanco); }
  .card.ancha p { opacity: .8; }
  .card.ancha .logo-actio { display: block; width: 88px; flex-shrink: 0; height: auto; }
  .card.ancha .status.live { background: rgba(255,255,255,.16); color: var(--blanco); }
  .card.ancha .go { background: var(--blanco); color: var(--verde-actio); }

  .icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--c) 12%, white);
    color: var(--c);
  }
  .icon svg { width: 20px; height: 20px; }
  .card h2 { margin-top: 16px; font-size: 16px; font-weight: 700; color: var(--negro); }
  .card p { margin-top: 4px; font-size: 12.5px; color: var(--gris); line-height: 1.5; }

  .card-foot { margin-top: auto; padding-top: 18px; display: flex; align-items: center; justify-content: space-between; }
  .status { font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
  .status.live { background: #e6f5ec; color: #17804a; }
  .status.soon { background: #f0f1f4; color: var(--gris); }
  .go {
    width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%;
    background: var(--c); color: var(--blanco);
    display: grid; place-items: center;
  }
  .card.off .go { background: var(--linea); }
  .go svg { width: 12px; height: 12px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    body { flex-direction: column; }
    .brand { flex-direction: row; align-items: center; }
    .logo-box { width: 200px; padding: 8px 10px; }
    .main { margin-left: 0; }
    .topbar { display: none; }                 /* su contenido pasa a la franja azul */
    .brand { flex-direction: row; align-items: center; justify-content: space-between; width: 100%; gap: 12px; }
    .movil-acciones { display: flex; }
    .sidebar {
      width: 100%; height: auto; position: static; overflow: visible;
      padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 18px;
    }
    .nav, .sidebar-foot { display: none; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    .card, .card.ancha { grid-column: span 1; }
    .card.ancha { height: auto; min-height: 84px; padding: 14px 16px; column-gap: 14px; }
    .topbar { padding: 14px 20px; }
  }
  @media (max-width: 560px) {
    .movil-titulo { display: none; }
    .grid { grid-template-columns: 1fr; }
    .card, .card.ancha { grid-column: span 1; }
    h1 { font-size: 26px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
