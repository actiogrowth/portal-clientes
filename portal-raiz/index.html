<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vida en Arte 360</title>
<!-- App instalable (23-oct): manifiesto e íconos en comun/, públicos. -->
<link rel="manifest" href="/comun/app.webmanifest?v=e5f020c113">
<meta name="theme-color" content="#FAF8F5">
<link rel="icon" type="image/png" sizes="192x192" href="/comun/app-icono-192.png?v=ce63fbd4f4">
<link rel="apple-touch-icon" href="/comun/app-icono-180.png?v=56fff6a358">
<meta name="apple-mobile-web-app-title" content="VEA 360">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 3-nov (ajuste 3): la apariencia (claro, oscuro o automático) antes de pintar: sin parpadeo. -->
<script src="/comun/tema.js?v=1765abd1c2"></script>
<link rel="stylesheet" href="/comun/vea.css?v=091edd1f0f">
</head>
<body>
<!-- Inicio (21-oct; 23-oct, por marca; 3-nov, rediseño etapa 1). Página fija:
     quién soy y qué veo salen de Datos.sesion() (comun/datos.js). Abrir cada
     sección lo vuelve a comprobar el servidor.
       /              saludo, una tarjeta por marca con sus unidades y un dato
                      rápido real de cada una, accesos rápidos del rol y el
                      Resumen del negocio en corto (Dirección y Administrador)
       /?marca=vea    la página de una marca: solo su tarjeta
       /?marca=kids
     Cada unidad aparece solo si el rol tiene su área; una marca sin unidades
     del rol no aparece. La navegación (barra lateral) y las notificaciones
     (lo que antes era «Pendientes de hoy») las pone Marca.cabecera.
     Los datos rápidos se leen DESPUÉS de pintar, por la capa de datos:
       After School  Datos.afterSchool('leer')  (quien tiene as.ver)
       Preschool     Datos.resumen.leer()       (quien abre el Resumen)
     y las cuentas son las de comun/cifras.js, las mismas del Resumen completo. -->
<header id="cab"></header>
<main class="pagina">
  <section class="encabezado ini-saludo">
    <div>
      <p class="ayuda" id="hoy"></p>
      <h1 class="titulo" id="hola">Hola</h1>
    </div>
  </section>
  <div id="avisos"></div>
  <div id="contenido">
    <!-- Mientras llega la sesión: la forma de la página en gris. -->
    <div id="esqueleto"></div>
  </div>
  <footer class="ayuda">© 2026 Vida en Arte · Hecho por Actio Growth</footer>
</main>
<script src="/comun/datos.js?v=62fa2e69ae"></script>
<script src="/comun/marca.js?v=a164bb9f9b"></script>
<script src="/comun/cifras.js?v=5f9322ccbb"></script>
<script>
'use strict';
const esc = Marca.esc, icono = Marca.icono;
const $ = s => document.querySelector(s);
$('#esqueleto').innerHTML = Marca.esqueleto('inicio');

/* La franja de color de cada marca (arriba de su tarjeta). */
const FRANJA = { vea: 'var(--franja-vea)', kids: 'var(--franja-kids)' };   // los colores, en los tokens de vea.css
/* Accesos rápidos: solo los que el rol puede hacer. 3-nov: «Mensaje a familias» para quien abre Mensajes (área mensajes). */
const ACCESOS = [
  { texto: 'Pasar lista', desc: 'Clases de hoy', url: '/after-school/#lista', icono: 'pasarLista', fondo: 'var(--activo)', letra: 'var(--sobre-activo)', permiso: 'as.lista.marcar' },
  { texto: 'Agendar visita', desc: 'Prueba, reposición o eventual', url: Marca.urlNuevo('visita'), icono: 'calendario', fondo: 'var(--accion)', permiso: 'as.pruebas.agendar' },
  { texto: 'Inscribir', desc: 'Niño nuevo', url: Marca.urlNuevo('inscribir'), icono: 'mas', fondo: 'var(--ok)', permiso: 'as.completo' },
  { texto: 'Mensaje a familias', desc: 'Correo a uno o varios grupos', url: Marca.urlNuevo('mensaje'), icono: 'sobre', fondo: 'var(--telas)', area: 'mensajes' }
];
const MI_LISTA = { texto: 'Mi lista', desc: 'La lista de verificación de tus puestos', url: '/equipo/', icono: 'lista', fondo: 'var(--telas)' };
const PRONTO = 'Próximamente';
const flecha = icono('flecha', 18);
const pct = v => Math.round(v * 100) + ' %';
const plural = (n, uno, varios) => n + ' ' + (n === 1 ? uno : varios);

let S = null, ve = () => false, permAS = () => false;

/* Una unidad dentro de su marca. Sin página: «Próximamente», atenuada y sin enlace. */
function unidad(area) {
  const u = Marca.UNIDADES[area];
  const ic = '<span class="ini-ic" style="background:color-mix(in srgb, ' + u.color + ' 14%, var(--panel));color:' + u.color + '">' + icono(u.icono, 22) + '</span>';
  if (!u.url) return '<div class="ini-unidad inactiva" aria-disabled="true">' + ic + '<span class="ini-unidad-txt"><b>' + esc(u.nombre) + '</b><span>' + esc(u.desc) + '</span></span>' +
    '<span class="chip pronto">' + PRONTO + '</span></div>';
  return '<a class="ini-unidad" href="' + esc(u.url) + '" data-unidad="' + area + '">' + ic +
    '<span class="ini-unidad-txt"><b>' + esc(u.nombre) + '</b><span data-dato>' + esc(u.desc) + '</span><span class="barra oculto" data-barra><i style="--c:' + u.color + ';width:0"></i></span></span>' + flecha + '</a>';
}
function tarjetaMarca(m) {
  const us = m.areas.filter(ve);
  if (!us.length) return '';
  return '<section class="tarjeta ini-marca" style="--franja:' + FRANJA[m.id] + '" aria-label="' + esc(m.nombre) + '">' +
    '<div class="ini-marca-cab"><a href="' + esc(m.url) + '" aria-label="' + esc(m.nombre) + ': solo sus unidades">' + (m.kids ? '<img src="' + esc(m.logo.src) + '" alt="' + esc(m.logo.alt) + '" class="kids logo-placa">' : Marca.logoVea('')) + '</a>' +
    '<span class="ayuda">' + plural(us.length, 'unidad', 'unidades') + '</span></div>' + us.map(unidad).join('') + '</section>';
}
function acceso(a) {
  return '<a class="tarjeta ini-acceso" href="' + esc(a.url) + '"><span class="ini-ic" style="background:' + a.fondo + (a.letra ? ';color:' + a.letra : '') + '">' + icono(a.icono, 22) + '</span>' +
    '<span><b>' + esc(a.texto) + '</b><small>' + esc(a.desc) + '</small></span></a>';
}

/* El dato rápido de una unidad: texto y barra de ocupación (0–1). */
function ponerDato(area, texto, ocupacion) {
  const a = document.querySelector('[data-unidad="' + area + '"]');
  if (!a) return;
  if (texto) a.querySelector('[data-dato]').textContent = texto;
  const b = a.querySelector('[data-barra]');
  if (ocupacion != null) { b.classList.remove('oculto'); b.querySelector('i').style.width = Math.max(2, Math.min(100, ocupacion * 100)) + '%'; b.title = 'Ocupación ' + pct(ocupacion); }
}

/* After School: inscritos activos y la ocupación de la semana (R125, la misma del Resumen). */
function datoAS(E) {
  const servicios = [...new Set((E.clases || []).filter(c => c.activa).map(c => c.servicio))];
  const lista = servicios.length > 1 ? servicios.slice(0, -1).join(', ') + ' y ' + servicios[servicios.length - 1] : servicios.join('');
  const activos = new Set((E.ninos || []).filter(n => n.estado === 'Activo').map(n => n.id)).size;
  const o = Cifras.ocupacionAS(E);
  ponerDato('afterschool', plural(activos, 'inscrito', 'inscritos') + (lista ? ' · ' + lista : ''), o ? o.valor : null);
}

/* El Resumen del negocio en corto: las mismas cuentas que /resumen/ (Cifras.resumenNegocio), el mes en curso. */
function resumenCorto(N, E) {
  const as = N.unidades.find(u => u.nombre === 'After School'), pre = N.unidades.find(u => u.nombre === 'Preschool');
  const cifra = (tit, valor, nota) => '<div class="ini-cifra"><span>' + esc(tit) + '</span>' +
    (valor === null ? '<span><span class="chip pronto">' + PRONTO + '</span></span>' : '<span class="cifra-grande num">' + esc(valor) + '</span>') + '<small>' + esc(nota) + '</small></div>';
  // Niños activos del negocio: no se suma (R128, el mismo niño puede estar en dos unidades con IDs distintos). Se dice por unidad.
  const porUnidad = [as, pre].filter(u => u.activos.valor !== null).map(u => u.nombre + ' ' + u.activos.valor).join(' · ');
  const o = E ? Cifras.ocupacionAS(E) : null;
  const F = N.finanzas;
  return cifra('Niños activos', N.ninos.activos.valor, porUnidad ? 'Por unidad: ' + porUnidad : N.ninos.activos.motivo) +
    cifra('Ocupación After School', as.ocupacion.valor === null ? null : pct(as.ocupacion.valor), o ? o.inscritos + ' de ' + o.cupos + ' cupos, esta semana' : as.ocupacion.motivo) +
    cifra('Ocupación Preschool', pre.ocupacion.valor === null ? null : pct(pre.ocupacion.valor), pre.activos.valor !== null ? plural(pre.activos.valor, 'niño', 'niños') + (pre.aviso ? ' · ' + pre.aviso : '') : pre.ocupacion.motivo) +
    cifra('Facturación del mes', F.disponible ? '$' + Math.round(F.facturacion).toLocaleString('es') : null, F.disponible ? Cifras.nombrePeriodo(N.periodo) : 'Cuando Finanzas tenga su fuente');
}

function pintar(m) {
  const marcas = (m ? [m] : Marca.MARCAS).map(tarjetaMarca).join('');
  const accesos = m ? [] : ACCESOS.filter(a => a.area ? ve(a.area) : (ve('afterschool') && permAS(a.permiso)));
  let html = marcas ? '<div class="ini-marcas">' + marcas + '</div>' : '';
  if (!m) html += '<section id="accesos"' + (accesos.length ? '' : ' class="oculto"') + ' aria-labelledby="tAccesos"><div class="seccion-tit"><h2 id="tAccesos">Accesos rápidos</h2></div>' +
    '<div class="ini-accesos" id="accesosLista" style="margin-top:12px">' + accesos.map(acceso).join('') + '</div></section>';
  if (!m && ve('resumen')) html += '<section class="tarjeta ini-resumen" aria-labelledby="tResumen"><div class="ini-resumen-cab"><h2 id="tResumen">' + icono('resumen', 20) +
    'Resumen del negocio <small id="resumenMes"></small></h2><a href="/resumen/">Ver completo ' + icono('flecha', 16) + '</a></div>' +
    '<div class="ini-cifras" id="resumenCifras">' + Array.from({ length: 4 }, () => '<div class="ini-cifra"><i class="esq-b" style="width:60%;height:14px"></i><i class="esq-b" style="width:40%;height:32px"></i></div>').join('') + '</div></section>';
  $('#contenido').innerHTML = html ||
    '<div class="aviso info">Tu usuario todavía no tiene secciones asignadas. Si necesitas entrar a alguna, pídeselo a Dirección.</div>';
}

async function cargar() {
  try { S = await Datos.sesion(); }
  catch (e) { if (e.codigo === 'sesion') { Datos.aLogin(); return; } $('#esqueleto').innerHTML = ''; $('#avisos').innerHTML = '<div class="aviso mal">' + esc(e.message) + '</div>'; return; }
  ve = a => S.areas === '*' || (Array.isArray(S.areas) && S.areas.includes(a));
  permAS = p => Array.isArray(S.permisosAS) && S.permisosAS.includes(p);
  const m = Marca.MARCAS.find(x => x.id === new URLSearchParams(location.search).get('marca'));
  if (m) {
    if (m.kids) document.documentElement.classList.add('tema-kids');
    document.title = m.nombre + ' · Vida en Arte 360';
    Marca.cabecera($('#cab'), { sesion: S, ruta: [{ texto: 'Inicio', url: '/' }, { texto: m.nombre }] });
    $('#hoy').textContent = 'Inicio'; $('#hola').textContent = m.nombre;
    pintar(m);
    if (!m.areas.some(ve)) $('#contenido').innerHTML = '<div class="aviso info">Tu usuario no tiene unidades de ' + esc(m.nombre) + '. <a href="/">Volver al inicio</a></div>';
  } else {
    Marca.cabecera($('#cab'), { sesion: S });
    $('#hoy').textContent = Marca.fechaLarga();
    $('#hola').textContent = Marca.saludo(S);
    pintar(null);
  }
  datosRapidos(!m);
}

/* Lo que se lee después de pintar: no frena Inicio. Cada lectura que falla deja la descripción de la unidad. */
function datosRapidos(conResumen) {
  const leeAS = ve('afterschool') && permAS('as.ver');
  const pAS = leeAS ? Datos.afterSchool('leer').then(j => j.resultado) : Promise.resolve(null);
  if (leeAS) pAS.then(E => { if (E) { Marca.datosAS = E; datoAS(E); } }).catch(() => {});
  if (ve('resumen')) {
    Promise.allSettled([Datos.resumen.leer(), pAS]).then(([r, a]) => {
      if (r.status === 'rejected') { if (r.reason.codigo === 'sesion') Datos.aLogin(); else if ($('#resumenCifras')) $('#resumenCifras').innerHTML = '<p class="ayuda" style="padding:16px 20px">No se pudo leer el Resumen: ' + esc(r.reason.message) + '</p>'; return; }
      const R = r.value.resultado, E = a.status === 'fulfilled' ? a.value : null;
      const periodo = (R.hoy || (E && E.hoy) || new Date().toISOString()).slice(0, 7);
      const N = Cifras.resumenNegocio({ periodo, E, pre: R.preschool, metas: R.metas, finanzas: R.finanzas });
      const pre = N.unidades.find(u => u.nombre === 'Preschool');
      if (pre.activos.valor !== null) ponerDato('kinder', plural(pre.activos.valor, 'niño', 'niños') + (pre.ocupacion.valor !== null ? ' · ' + pct(pre.ocupacion.valor) + ' de ocupación' : ''), pre.ocupacion.valor);
      if (conResumen && $('#resumenCifras')) { $('#resumenCifras').innerHTML = resumenCorto(N, E); $('#resumenMes').textContent = '· ' + Cifras.nombrePeriodo(N.periodo).toLowerCase(); }
    });
  }
  // Mi lista: solo si ocupa un puesto «Abierto al equipo» (lo decide el servidor).
  if (conResumen && ve('equipo')) Datos.equipo.leer().then(j => {
    const n = j.resultado.mios.length;
    if (!n || !$('#accesosLista')) return;
    $('#accesosLista').insertAdjacentHTML('beforeend', acceso(Object.assign({}, MI_LISTA, { desc: n === 1 ? 'La lista de verificación de tu puesto' : MI_LISTA.desc })));
    $('#accesos').classList.remove('oculto');
  }).catch(() => {});
}
cargar();
</script>
</body>
</html>
