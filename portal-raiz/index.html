<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Portal · Vida en Arte 360</title>
<link rel="stylesheet" href="/comun/vea.css?v=9eadc9a5d1">
</head>
<body>
<!-- Portada del portal (21-oct, rediseño con la marca Vida en Arte).
     Página fija: quién soy y qué tarjetas veo salen de Datos.sesion()
     (comun/datos.js). Abrir cada sección lo vuelve a comprobar el servidor. -->
<header id="cab"></header>
<main class="pagina">
  <section class="encabezado">
    <div>
      <p class="ayuda" id="hoy"></p>
      <h1 class="titulo" id="hola">Hola</h1>
      <p style="font-size:17px;color:var(--texto-2)">¿A dónde quieres ir hoy?</p>
    </div>
    <div class="adorno" aria-hidden="true"><i class="b1"></i><i class="r1"></i><i class="b2"></i><i class="r2"></i><i class="b3"></i></div>
  </section>
  <div id="avisos"></div>
  <div id="grupos"></div>
  <footer class="ayuda">© 2026 Vida en Arte · Hecho por Actio Growth</footer>
</main>
<script src="/comun/datos.js?v=fe16b3d544"></script>
<script src="/comun/marca.js?v=bc6a4e424f"></script>
<script>
'use strict';
/* Las tarjetas. area: la que pide (permisos.php); url vacía = «Próximamente»
   (se ve atenuada, sin enlace y no se puede tocar). */
const GRUPOS = [
  { id: 'vea', titulo: 'Vida en Arte', unidades: [
    { nombre: 'After School', url: '/after-school/', area: 'afterschool', color: 'var(--rojo)', icono: 'parkour',
      desc: 'Ocupación, niños, visitas del día, Pasar lista y seguimiento.' },
    { nombre: 'Veranito', url: '/veranito/', area: 'veranito', color: 'var(--naranja)', icono: 'sol', oscuro: true, desc: 'Temporada de vacaciones.' },
    { nombre: 'Cumpleaños', url: '', area: 'cumpleanos', color: 'var(--azul)', icono: 'torta', desc: 'Reservas y eventos.' }
  ] },
  { id: 'kids', titulo: 'Vida en Arte Kids', logo: '/comun/logo-kids.png?v=84821d6ddf', unidades: [
    { nombre: 'Preschool', url: '/kinder/', area: 'kinder', color: '#7E53A2', icono: 'arcoiris', cuadrado: true, desc: 'Tablero de matrícula y ocupación.' },
    { nombre: 'Baby & Me', url: '', area: 'babyandme', color: '#68A8C9', icono: 'corazon', cuadrado: true, desc: 'Grupos y asistencia.' }
  ] },
  { id: 'admin', titulo: 'Administración', fila: true, unidades: [
    { nombre: 'Base de Datos', url: '/basededatos/', area: 'basededatos', icono: 'datos', desc: 'Clientes de todas las unidades' },
    { nombre: 'Configuración', url: '/configuracion/', area: 'configuracion', icono: 'usuarios', desc: 'Usuarios y roles' },
    { nombre: 'Proyecto Actio', url: '/proyecto-actio/', area: 'proyecto-actio', icono: 'sistema', desc: 'Entregables, reuniones y acompañamiento' }
  ] }
];
const ICONOS = {
  parkour: '<circle cx="13" cy="4" r="2"/><path d="M4 22l4-7 3 2 2-5 4 3"/><path d="M9 9l3-1 3 3 4 1"/>',
  sol: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  torta: '<path d="M4 21V13a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8"/><path d="M4 16c1.3 1 2.7 1 4 0s2.7-1 4 0 2.7 1 4 0 2.7-1 4 0"/><path d="M2 21h20M12 11V8"/>',
  arcoiris: '<path d="M4 18a8 8 0 0 1 16 0"/><path d="M7.5 18a4.5 4.5 0 0 1 9 0"/><path d="M2 18h20"/>',
  corazon: '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>',
  datos: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
  usuarios: '<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M17 11h4M19 9v4"/>',
  sistema: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7M17.5 14v7"/>'
};
const esc = Marca.esc;
const svg = (k, color) => '<svg viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONOS[k] + '</svg>';

function tarjeta(u, fila) {
  const activa = !!u.url;
  const icono = '<span class="icono" style="background:' + (fila ? 'var(--negro)' : u.color) + (u.cuadrado ? ';border-radius:16px' : '') + '">' +
    svg(u.icono, u.oscuro ? '#111111' : '#FFFFFF') + '</span>';
  const texto = '<span style="display:flex;flex-direction:column;gap:4px"><span class="nombre">' + esc(u.nombre) + '</span><span class="desc">' + esc(u.desc) + '</span></span>';
  if (!activa) return '<div class="unidad inactiva' + (fila ? ' fila' : '') + '" aria-disabled="true">' + icono + texto +
    '<span class="estado"><span class="chip">Próximamente</span></span></div>';
  const fuera = /^https?:/.test(u.url);
  return '<a class="unidad' + (fila ? ' fila' : '') + '" href="' + esc(u.url) + '"' + (fuera ? ' target="_blank" rel="noopener"' : '') + '>' + icono + texto + '</a>';
}

function titulo(g, i) {
  if (g.logo) return '<div class="kids-tit"><img src="' + g.logo + '" alt="' + esc(g.titulo) + '"><div class="franja" aria-hidden="true">' +
    ['#D53B2C', '#EC893E', '#FCCC14', '#9DCC4C', '#68A8C9', '#1E63AB', '#7E53A2'].map(c => '<span style="background:' + c + '"></span>').join('') + '</div></div>';
  return '<div class="seccion-tit"><h2 class="titulo">' + esc(g.titulo) + '</h2><div class="raya' + (i % 2 ? ' otra' : '') + '" aria-hidden="true"></div></div>';
}

async function cargar() {
  let s;
  try { s = await Datos.sesion(); }
  catch (e) { if (e.codigo === 'sesion') { Datos.aLogin(); return; } $('#avisos').innerHTML = '<div class="aviso mal">' + esc(e.message) + '</div>'; return; }
  Marca.cabecera(document.getElementById('cab'), { sesion: s });
  document.getElementById('hoy').textContent = Marca.fechaLarga();
  document.getElementById('hola').textContent = 'Hola, ' + s.usuario;
  const ve = a => s.areas === '*' || (Array.isArray(s.areas) && s.areas.includes(a));
  const html = GRUPOS.map(g => ({ g, us: g.unidades.filter(u => ve(u.area)) })).filter(x => x.us.length).map((x, i) =>
    '<section style="display:flex;flex-direction:column;gap:20px">' + titulo(x.g, i) + '<div class="unidades' + (x.g.fila ? ' fila' : '') + '">' + x.us.map(u => tarjeta(u, x.g.fila)).join('') + '</div></section>').join('');
  document.getElementById('grupos').innerHTML = html ||
    '<div class="aviso info">Tu usuario todavía no tiene secciones asignadas. Si necesitas entrar a alguna, pídeselo a Dirección.</div>';
  document.getElementById('grupos').style.cssText = 'display:flex;flex-direction:column;gap:44px';
}
const $ = s => document.querySelector(s);
cargar();
</script>
</body>
</html>
