# Pruebas de la herramienta After School (Vida en Arte).
# Corren aquí y no en el equipo de desarrollo: allí el antivirus retiene las
# pruebas de PHP. Solo usan datos inventados de las pruebas; ningún secreto.
name: Pruebas After School

on:
  push:
    branches: [after-school-registro, roles-usuarios]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: PHP 8.3 con curl (el que trae la imagen)
        run: |
          php -v
          php -r 'exit(PHP_VERSION_ID >= 80300 && PHP_VERSION_ID < 80400 && function_exists("curl_init") ? 0 : 1);'

      - name: Pruebas de JavaScript (AfterSchool.gs en el simulador)
        env:
          TZ: America/Bogota
        run: node after-school-script/pruebas/prueba-after-school.js

      - name: Roturas de AfterSchool.gs
        env:
          TZ: America/Bogota
        run: node after-school-script/pruebas/roturas.js

      - name: Prueba del transporte de api.php
        env:
          PHP: php
        run: node after-school-script/pruebas/correr-prueba-transporte.js

      - name: Roturas de api.php
        env:
          PHP: php
        run: node after-school-script/pruebas/roturas-api.js

  portal:
    # Roles y usuarios del portal: un servidor PHP de verdad (php -S) con las
    # reglas de htaccess.txt, usuarios inventados y un Apps Script falso.
    runs-on: ubuntu-24.04
    timeout-minutes: 90   # 23-oct: ~104 roturas × ~31 s (cada una corre la prueba entera del portal)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sintaxis de los PHP
        run: for f in portal-raiz/*.php configuracion/*.php after-school/*.php pasar-lista/*.php proyecto-actio/*.php procesos/*.php equipo/*.php; do php -l "$f" || exit 1; done

      - name: Proyecto Actio · Apps Script (lectura por títulos, nada interno)
        run: node proyecto-actio-script/pruebas/prueba-proyecto-actio.js

      - name: Proyecto Actio · roturas del Apps Script
        run: node proyecto-actio-script/pruebas/roturas.js

      - name: Equipo · Apps Script (Procesos.gs: lectura por títulos, solo escribe en Aceptaciones, Marcas y Revisiones)
        run: node procesos-script/pruebas/prueba-procesos.js

      - name: Equipo · roturas del Apps Script
        run: node procesos-script/pruebas/roturas.js

      - name: Proyecto Actio · visor por tipo de enlace
        run: node pruebas-portal/prueba-visor.js

      - name: Versión de los archivos de comun/ en cada página (caché del navegador)
        run: node pruebas-portal/prueba-versiones.js

      - name: Sintaxis de comun/ (capa de datos y marca)
        run: for f in comun/*.js; do node --check "$f" || exit 1; done

      - name: Roles y usuarios, de punta a punta
        env:
          PHP: php
        run: node pruebas-portal/prueba-portal.js

      - name: Roturas de roles y usuarios
        env:
          PHP: php
        run: node pruebas-portal/roturas-portal.js
