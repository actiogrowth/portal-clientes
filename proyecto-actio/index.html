<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Proyecto Actio · Vida en Arte 360</title>
<!-- Proyecto Actio: lo que Actio Growth le entrega a Vida en Arte. Solo
  lectura. Lee SOLO a través de la capa de datos (/comun/datos.js →
  proyecto-actio/api.php), que ya recorta por rol: Dirección nunca recibe
  Proyecto 2. 23-oct: cabecera baja como el resto del portal, pestaña
  Documentos (todas las filas de «Documentos VEA») y desplegables por unidad
  y por mes, cerrados al abrir cada pestaña. -->
<!-- App instalable (23-oct): manifiesto e íconos en comun/, públicos. -->
<link rel="manifest" href="/comun/app.webmanifest?v=e5f020c113">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/png" sizes="192x192" href="/comun/app-icono-192.png?v=ce63fbd4f4">
<link rel="apple-touch-icon" href="/comun/app-icono-180.png?v=56fff6a358">
<meta name="apple-mobile-web-app-title" content="VEA 360">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/comun/vea.css?v=8e979f9099">
</head>
<body>
<header id="cab"></header>
<main class="pagina pa">
  <section class="encabezado encabezado-as">
    <div>
      <h1 class="titulo">Proyecto Actio</h1>
      <p class="ayuda" id="paSello" aria-live="polite"></p>
    </div>
    <div class="pa-proyectos" id="paProyectos" role="group" aria-label="Proyecto"></div>
  </section>
  <div class="pa-barra-pestanas">
    <nav class="pestanas" role="tablist" id="pestanas" aria-label="Secciones de Proyecto Actio">
      <button role="tab" data-vista="entregables" aria-selected="true">Entregables</button>
      <button role="tab" data-vista="documentos" aria-selected="false">Documentos</button>
      <button role="tab" data-vista="reuniones" aria-selected="false">Reuniones</button>
      <button role="tab" data-vista="atencion" aria-selected="false">Acompañamiento</button>
    </nav>
    <label class="pa-buscar" id="paBuscarCaja">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="paBuscar" placeholder="Buscar" aria-label="Buscar" autocomplete="off">
    </label>
  </div>

  <div id="pantalla" class="pantalla"><h2>Cargando…</h2><p>Leyendo lo que Actio Growth le ha entregado a Vida en Arte.</p></div>
  <div id="avisos"></div>

  <section id="v-entregables" class="vista oculto columna"><p class="pa-resumen" id="paResumenE"></p><div id="paEntregables" class="pa-grupos"></div></section>
  <section id="v-documentos" class="vista oculto columna"><p class="pa-resumen" id="paResumenD"></p><div id="paDocumentos" class="pa-grupos"></div></section>
  <section id="v-reuniones" class="vista oculto columna"><div id="paReuniones" class="pa-grupos pa-meses"></div></section>
  <section id="v-atencion" class="vista oculto columna">
    <div id="paAcomp" class="pa-acomp"></div>
    <div id="paAtLista" class="pa-lista oculto"></div>
  </section>
</main>

<script src="/comun/datos.js?v=1b3dcca978"></script>
<script src="/comun/marca.js?v=37b691d840"></script>
<script src="/comun/visor.js?v=3de76954cc"></script>
<script src="/comun/visor-pantalla.js?v=091ac5add1"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = Marca.esc;
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MESES_LARGOS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const esFecha = iso => /^\d{4}-\d{2}-\d{2}$/.test(iso || '');
const fecha = iso => esFecha(iso) ? +iso.slice(8, 10) + ' ' + MESES[+iso.slice(5, 7) - 1] + ' ' + iso.slice(0, 4) : '';
const mesLargo = k => MESES_LARGOS[+k.slice(5, 7) - 1] + ' ' + k.slice(0, 4);
const decimal = n => (Math.round(n * 10) / 10).toFixed(1).replace('.', ',');   // siempre un decimal: 1,0 · 12,5
const plural = (n, uno, varios) => n + ' ' + (n === 1 ? uno : varios);

/* Cada unidad con su color e iniciales: comun/marca.js (la comparte con Procesos). */
const unidad = Marca.unidadDoc;

/* Estado del entregable en tres palabras. */
function estadoDe(e) {
  const s = norm(e.estado);
  if (s.startsWith('entregad') || s === 'completado' || s === 'hecho') return 'Entregado';
  if (/curso|progreso|proceso|revision/.test(s)) return 'En curso';
  return 'Pendiente';
}

/* Íconos de línea (sin emojis). */
const ICONO = {
  'Documento': '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
  'Presentación': '<path d="M3 4h18v12H3z"/><path d="M8 20h8M12 16v4"/>',
  'Interactiva': '<path d="M4 4l7 17 2-7 7-2z"/>',
  'Minuta': '<path d="M6 3h9l4 4v14H6z"/><path d="M9 13h7M9 17h5"/>',
  'Grabación': '<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>',
  'Abrir': '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  'Descargar': '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>'
};
const icono = k => '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONO[k] || '') + '</svg>';
const FLECHA = '<svg class="pa-flecha" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

let D = null, copia = null, proyecto = '', vista = 'entregables', busqueda = '';
/* Qué grupos están abiertos en cada pestaña. Se vacía al abrir la pestaña:
   todas empiezan cerradas. */
const abiertos = { entregables: new Set(), documentos: new Set(), reuniones: new Set() };

function pantalla(html) { $('#pantalla').innerHTML = html; $('#pantalla').classList.remove('oculto'); }

async function cargar() {
  try {
    const j = await Datos.proyectoActio.leer();
    D = j.resultado; copia = j.copia || null;
  } catch (e) {
    if (e.codigo === 'sesion') { Datos.aLogin(); return; }
    pantalla('<h2>No se pudo leer Proyecto Actio</h2><p>La página no muestra nada hasta poder leer los datos, para no dar a entender que no hay entregas.</p><pre>' +
      esc(e.message) + '</pre><button class="btn" id="reintentar" type="button">Reintentar</button>');
    $('#reintentar').onclick = () => { pantalla('<h2>Cargando…</h2>'); cargar(); };
    return;
  }
  if (!D.proyectos.includes(proyecto)) proyecto = D.proyectos[0] || '';
  $('#pantalla').classList.add('oculto');
  pintar();
  mostrarVista(vista);
}

const delProyecto = lista => (lista || []).filter(f => f.proyecto === proyecto);
const soloActio = p => ['entregables', 'documentos', 'reuniones', 'atencion'].some(k => (D[k] || []).some(f => f.proyecto === p && f.soloActio));

function pintar() {
  pintarCabecera();
  $('#avisos').innerHTML = (D.faltan || []).length
    ? '<div class="aviso ojo">En el Sheet faltan columnas o pestañas: ' + esc(D.faltan.join(' · ')) + '. Esas partes salen vacías.</div>' : '';
  pintarEntregables(); pintarDocumentos(); pintarReuniones(); pintarAcompanamiento();
}

/* ── Cabecera: desde cuándo (todos los datos), datos al, selector ────────── */
function pintarCabecera() {
  const todas = [].concat(
    D.entregables.map(e => e.fechaReal), D.entregables.map(e => e.fechaCompromiso),
    D.documentos.map(d => d.fecha), D.reuniones.map(r => r.fecha), D.atencion.map(a => a.fecha)).filter(esFecha).sort();
  const gen = D.generado ? new Date(D.generado) : null;
  const partes = [];
  if (todas.length) partes.push('Desde ' + mesLargo(todas[0]).replace(' ', ' de '));
  if (gen && !isNaN(gen)) partes.push('datos al ' + gen.getDate() + ' de ' + MESES_LARGOS[gen.getMonth()] +
    (copia && copia.segundos > 60 ? ' (copia de hace ' + Math.round(copia.segundos / 60) + ' min)' : ''));
  $('#paSello').textContent = partes.join(' · ');
  $('#paProyectos').innerHTML = D.proyectos.length > 1 || D.proyectos.some(soloActio)
    ? D.proyectos.map(p => '<button type="button" aria-pressed="' + (p === proyecto) + '" data-proyecto="' + esc(p) + '">' + esc(p) +
        (soloActio(p) ? ' · Solo Actio' : '') + '</button>').join('')
    : (proyecto ? '<span class="pa-proy-unico">' + esc(proyecto) + '</span>' : '');
  $('#paProyectos').querySelectorAll('[data-proyecto]').forEach(b => b.onclick = () => {
    proyecto = b.dataset.proyecto; Object.values(abiertos).forEach(s => s.clear()); pintar();
  });
}

/* ── Desplegables: un botón con aria-expanded abre y cierra cada grupo ───── */
/* Con una búsqueda escrita, se abren solos los grupos donde hay resultados
   (y los que no tienen ninguno no se muestran). */
function grupo(pestana, clave, cabecera, cuerpo, total) {
  const id = 'g-' + pestana + '-' + clave.replace(/[^a-z0-9]/gi, '-');
  // La búsqueda solo abre grupos donde hay buscador (Entregables y Documentos);
  // si no, un texto que quedó escrito abría todos los meses de Reuniones.
  const buscando = !!busqueda.trim() && (pestana === 'entregables' || pestana === 'documentos');
  const abierto = buscando || abiertos[pestana].has(clave);
  return '<section class="pa-grupo"><h2 class="pa-grupo-h">' +
    '<button type="button" class="pa-grupo-cab" aria-expanded="' + abierto + '" aria-controls="' + id + '" data-grupo="' + esc(clave) + '" data-pestana="' + pestana + '">' +
      cabecera + '<span class="pa-grupo-n">' + total + '</span><i aria-hidden="true"></i>' + FLECHA + '</button></h2>' +
    '<div class="pa-grupo-cuerpo" id="' + id + '"' + (abierto ? '' : ' hidden') + '>' + cuerpo + '</div></section>';
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('.pa-grupo-cab');
  if (!b) return;
  const abrir = b.getAttribute('aria-expanded') !== 'true', set = abiertos[b.dataset.pestana];
  b.setAttribute('aria-expanded', String(abrir));
  document.getElementById(b.getAttribute('aria-controls')).hidden = !abrir;
  if (abrir) set.add(b.dataset.grupo); else set.delete(b.dataset.grupo);
});
const cabUnidad = u => '<span class="pa-insignia" style="background:' + u.fondo + ';color:' + u.texto + '" aria-hidden="true">' + esc(u.ini) + '</span><span class="titulo pa-grupo-nom">' + esc(u.nombre) + '</span>';

/* ── Entregables: por unidad, filas con un botón por versión ─────────────── */
function docsDe(e) { return D.documentos.filter(d => d.idEntregable && d.idEntregable === e.id && d.proyecto === e.proyecto); }

function pintarEntregables() {
  const todos = delProyecto(D.entregables);
  const hechos = todos.filter(e => estadoDe(e) === 'Entregado').length;
  $('#paResumenE').textContent = todos.length ? plural(todos.length, 'entregable', 'entregables') + ' · ' + Math.round(hechos / todos.length * 100) + ' % ' + (todos.length === 1 ? 'entregado' : 'entregados') : '';
  const q = norm(busqueda);
  const vistos = todos.filter(e => !q || norm(e.entregable + ' ' + e.segmento + ' ' + unidad(e.unidad).nombre).includes(q));
  if (!todos.length) { $('#paEntregables').innerHTML = '<div class="tarjeta"><p class="ayuda">Este proyecto todavía no tiene entregables.</p></div>'; return; }
  if (!vistos.length) { $('#paEntregables').innerHTML = '<div class="tarjeta"><p class="ayuda">Ningún entregable coincide con «' + esc(busqueda) + '».</p></div>'; return; }
  $('#paEntregables').innerHTML = [...new Set(vistos.map(e => unidad(e.unidad).nombre))].map(nom => {
    const es = vistos.filter(e => unidad(e.unidad).nombre === nom);
    return grupo('entregables', nom, cabUnidad(unidad(es[0].unidad)), '<div class="pa-filas">' + es.map(filaEntregable).join('') + '</div>',
      plural(es.length, 'entregable', 'entregables'));
  }).join('');
  $('#paEntregables').querySelectorAll('[data-abrir]').forEach(b => b.onclick = () => {
    const e = D.entregables.find(x => x.id === b.dataset.abrir && x.proyecto === proyecto);
    abrirVisor(e.entregable, unidad(e.unidad).nombre + (e.segmento ? ' · ' + e.segmento : ''), Visor.versiones(docsDe(e)), b.dataset.version);
  });
}

function filaEntregable(e) {
  const est = estadoDe(e), vs = Visor.versiones(docsDe(e));
  const cuando = est === 'Entregado' ? fecha(e.fechaReal) : (e.fechaCompromiso ? 'compromiso ' + fecha(e.fechaCompromiso) : 'sin fecha');
  const sub = [e.segmento, cuando].filter(Boolean).join(' · ');
  return '<div class="pa-fila-e">' +
    '<div class="pa-fila-e-txt"><span class="pa-fila-e-nom">' + esc(e.entregable) +
      (est !== 'Entregado' ? ' <span class="chip ' + (est === 'En curso' ? 'pa-curso' : 'pa-pend') + '">' + est + (est === 'En curso' && e.avance ? ' · ' + esc(e.avance) + ' %' : '') + '</span>' : '') +
      (e.ocultoCliente ? ' <span class="pa-oculto">Oculto al cliente</span>' : '') +
    '</span>' + (sub ? '<span class="ayuda">' + esc(sub) + '</span>' : '') + '</div>' +
    '<div class="pa-versiones-fila">' + (vs.length ? vs.map(v =>
      '<button type="button" class="pa-boton" data-abrir="' + esc(e.id) + '" data-version="' + esc(v.version) + '">' + icono(v.version) + esc(v.version) + '</button>').join('')
      : '<span class="pa-por-cargar">Documento por cargar</span>') + '</div>' +
    '</div>';
}

/* ── Documentos: TODAS las filas de «Documentos VEA», con o sin entregable ── */
/* Bajo el nombre va la versión, no la columna Tipo: Video si el nombre o el
   enlace lo dicen (etiqueta «(Video…)», Loom, YouTube, Vimeo); si no, la que
   deduce el visor (Documento / Presentación / Interactiva). */
function versionDoc(d) {
  if (/\(\s*video[^()]*\)\s*$/i.test(d.nombre || '') || /^https?:\/\/([^/]+\.)?(loom\.com|youtube\.com|youtu\.be|vimeo\.com)\//i.test(d.enlace || '')) return 'Video';
  return Visor.vista(d.enlace).modo !== 'nada' ? Visor.version(d.nombre, d.enlace) : '';
}
function pintarDocumentos() {
  const todos = delProyecto(D.documentos).slice().sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
  $('#paResumenD').textContent = todos.length ? plural(todos.length, 'documento', 'documentos') : '';
  const q = norm(busqueda);
  const vistos = todos.filter(d => !q || norm(d.nombre + ' ' + d.tipo + ' ' + d.segmento + ' ' + unidad(d.unidad).nombre).includes(q));
  if (!todos.length) { $('#paDocumentos').innerHTML = '<div class="tarjeta"><p class="ayuda">Este proyecto todavía no tiene documentos.</p></div>'; return; }
  if (!vistos.length) { $('#paDocumentos').innerHTML = '<div class="tarjeta"><p class="ayuda">Ningún documento coincide con «' + esc(busqueda) + '».</p></div>'; return; }
  const nombres = [...new Set(todos.map(d => unidad(d.unidad).nombre))].filter(n => vistos.some(d => unidad(d.unidad).nombre === n));
  $('#paDocumentos').innerHTML = nombres.map(nom => {
    const ds = vistos.filter(d => unidad(d.unidad).nombre === nom);
    return grupo('documentos', nom, cabUnidad(unidad(ds[0].unidad)), '<div class="pa-filas">' + ds.map(d => {
      const i = D.documentos.indexOf(d), puede = Visor.vista(d.enlace).modo !== 'nada', des = Visor.descarga(d.enlace);
      const sub = [versionDoc(d), fecha(d.fecha)].filter(Boolean).join(' · ');
      return '<div class="pa-fila-e"><div class="pa-fila-e-txt"><span class="pa-fila-e-nom">' + esc(d.nombre) +
        (d.ocultoCliente ? ' <span class="pa-oculto">Oculto al cliente</span>' : '') + '</span>' +
        (sub ? '<span class="ayuda">' + esc(sub) + '</span>' : '') + '</div><div class="pa-versiones-fila">' +
        (puede ? '<button type="button" class="pa-boton" data-doc="' + i + '">' + icono('Abrir') + 'Abrir</button>' : '<span class="pa-por-cargar">Sin enlace</span>') +
        (des ? '<a class="pa-boton" href="' + esc(des) + '" target="_blank" rel="noopener">' + icono('Descargar') + 'Descargar</a>' : '') +
        '</div></div>';
    }).join('') + '</div>', plural(ds.length, 'documento', 'documentos'));
  }).join('');
  $('#paDocumentos').querySelectorAll('[data-doc]').forEach(b => b.onclick = () => {
    const d = D.documentos[+b.dataset.doc];
    abrirVisor(Visor.nombreBase(d.nombre), [unidad(d.unidad).nombre, d.tipo].filter(Boolean).join(' · '),
      [{ version: Visor.version(d.nombre, d.enlace), nombre: d.nombre, enlace: d.enlace }]);
  });
}

$('#paBuscar').addEventListener('input', () => { busqueda = $('#paBuscar').value; pintarEntregables(); pintarDocumentos(); });

/* ── Reuniones: un desplegable por mes, fecha en forma de calendario ─────── */
function pintarReuniones() {
  const rs = delProyecto(D.reuniones).slice().sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
  if (!rs.length) { $('#paReuniones').innerHTML = '<div class="tarjeta"><p class="ayuda">No hay reuniones registradas en este proyecto.</p></div>'; return; }
  const meses = [];
  rs.forEach(r => { const k = esFecha(r.fecha) ? r.fecha.slice(0, 7) : 'sin-fecha'; let m = meses.find(x => x.k === k); if (!m) meses.push(m = { k, items: [] }); m.items.push(r); });
  $('#paReuniones').innerHTML = meses.map(m => grupo('reuniones', m.k,
    '<span class="pa-mes-nom">' + (m.k === 'sin-fecha' ? 'Sin fecha' : mesLargo(m.k)) + '</span>',
    m.items.map(r => {
      const i = rs.indexOf(r);
      return '<div class="pa-reu">' +
        (esFecha(r.fecha) ? '<div class="pa-cal" aria-label="' + esc(fecha(r.fecha)) + '"><span class="titulo">' + +r.fecha.slice(8, 10) + '</span><span>' + MESES[+r.fecha.slice(5, 7) - 1] + '</span></div>'
          : '<div class="pa-cal"><span>—</span></div>') +
        '<span class="pa-reu-tema">' + esc(r.tema) + '</span>' +
        '<div class="pa-versiones-fila">' +
          (Visor.vista(r.minuta).modo !== 'nada' ? '<button class="pa-boton" type="button" data-reu="' + i + '" data-que="minuta">' + icono('Minuta') + 'Minuta</button>' : '') +
          (Visor.vista(r.grabacion).modo !== 'nada' ? '<button class="pa-boton" type="button" data-reu="' + i + '" data-que="grabacion">' + icono('Grabación') + 'Grabación</button>' : '') +
        '</div></div>';
    }).join(''), plural(m.items.length, 'reunión', 'reuniones'))).join('');
  $('#paReuniones').querySelectorAll('[data-reu]').forEach(b => b.onclick = () => {
    const r = rs[+b.dataset.reu], minuta = b.dataset.que === 'minuta';
    abrirVisor(r.tema, fecha(r.fecha), [{ version: minuta ? 'Minuta' : 'Grabación', nombre: r.tema, enlace: minuta ? r.minuta : r.grabacion }]);
  });
}

/* ── Acompañamiento: totales (horas, encuentros, reuniones), barras y detalle ── */
function pintarAcompanamiento() {
  const as = delProyecto(D.atencion).slice().sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
  const nReu = delProyecto(D.reuniones).length;
  const totalMin = as.reduce((t, a) => t + (+a.duracionMin || 0), 0);
  const total = (n, et) => '<div><span class="titulo num">' + n + '</span><span class="ayuda">' + et + '</span></div>';
  const totales = '<div class="pa-acomp-tot">' + total(decimal(totalMin / 60) + ' h', 'de acompañamiento directo') +
    total(as.length, as.length === 1 ? 'encuentro' : 'encuentros') + total(nReu, nReu === 1 ? 'reunión de trabajo' : 'reuniones de trabajo') + '</div>';
  if (!as.length) {
    $('#paAcomp').innerHTML = totales + '<div class="tarjeta"><p class="ayuda">No hay acompañamiento directo registrado en este proyecto.</p></div>';
    $('#paAtLista').innerHTML = ''; return;
  }
  const meses = {};
  as.forEach(a => { if (!esFecha(a.fecha)) return; const k = a.fecha.slice(0, 7); (meses[k] = meses[k] || { n: 0, min: 0 }); meses[k].n++; meses[k].min += +a.duracionMin || 0; });
  // Todos los meses entre el primero y el último, aunque alguno no tenga encuentros (barra en cero).
  const ks = Object.keys(meses).sort(), serie = [];
  if (ks.length) for (let y = +ks[0].slice(0, 4), m = +ks[0].slice(5, 7); ; ) {
    const k = y + '-' + String(m).padStart(2, '0'); serie.push({ k, n: (meses[k] || {}).n || 0, h: ((meses[k] || {}).min || 0) / 60 });
    if (k === ks[ks.length - 1]) break; if (++m > 12) { m = 1; y++; }
  }
  const maxH = Math.max(...serie.map(s => s.h), 0.1);
  $('#paAcomp').innerHTML = totales +
    '<figure class="pa-grafico"><figcaption>Horas por mes</figcaption>' +
      '<div class="pa-barras" role="list">' + serie.map(s =>
        '<div class="pa-barra-col" role="listitem" tabindex="0" title="' + esc(mesLargo(s.k) + ': ' + decimal(s.h) + ' h en ' + plural(s.n, 'encuentro', 'encuentros')) + '"' +
          ' aria-label="' + esc(mesLargo(s.k) + ': ' + decimal(s.h) + ' horas, ' + plural(s.n, 'encuentro', 'encuentros')) + '">' +
          '<span class="pa-barra-val num">' + decimal(s.h) + '</span>' +
          '<i style="height:' + (s.h ? Math.max(3, Math.round(s.h / maxH * 130)) : 0) + 'px"></i>' +
          '<span class="pa-barra-mes">' + MESES[+s.k.slice(5, 7) - 1] + '</span>' +
          '<span class="pa-globo" aria-hidden="true">' + esc(mesLargo(s.k)) + '<b>' + decimal(s.h) + ' h · ' + plural(s.n, 'encuentro', 'encuentros') + '</b></span>' +
        '</div>').join('') + '</div></figure>' +
    '<button class="btn sec" type="button" id="paVerDetalle" aria-expanded="false" aria-controls="paAtLista">Ver el detalle de cada encuentro</button>';
  $('#paAtLista').innerHTML = as.map(a =>
    '<div class="pa-fila"><div class="pa-fecha num">' + esc(fecha(a.fecha) || 'Sin fecha') + '</div>' +
    '<div class="pa-fila-txt"><b>' + esc(a.asunto || a.tipo) + '</b><span class="ayuda">' + esc(a.tipo) +
      (a.duracionMin ? ' · ' + esc(a.duracionMin) + ' min' : '') + (a.unidad ? ' · ' + esc(unidad(a.unidad).nombre) : '') + '</span></div>' +
    '<div class="pa-fila-acc">' + (Visor.vista(a.enlace).modo !== 'nada' ? '<a class="btn sec chico" href="' + esc(a.enlace) + '" target="_blank" rel="noopener">Abrir</a>' : '') + '</div></div>').join('');
  $('#paAtLista').classList.add('oculto');
  $('#paVerDetalle').onclick = () => {
    const abrir = $('#paAtLista').classList.contains('oculto');
    $('#paAtLista').classList.toggle('oculto', !abrir);
    $('#paVerDetalle').setAttribute('aria-expanded', String(abrir));
    $('#paVerDetalle').textContent = abrir ? 'Ocultar el detalle' : 'Ver el detalle de cada encuentro';
  };
}

/* ── Pestañas ────────────────────────────────────────────────────────────── */
/* Al abrir una pestaña, todos sus grupos empiezan cerrados. */
function mostrarVista(v) {
  vista = v;
  if (abiertos[v]) { abiertos[v].clear(); if (D) ({ entregables: pintarEntregables, documentos: pintarDocumentos, reuniones: pintarReuniones })[v](); }
  document.querySelectorAll('#pestanas [data-vista]').forEach(b => b.setAttribute('aria-selected', b.dataset.vista === v ? 'true' : 'false'));
  document.querySelectorAll('.vista').forEach(s => s.classList.toggle('oculto', !D || s.id !== 'v-' + v));
  $('#paBuscarCaja').classList.toggle('oculto', v !== 'entregables' && v !== 'documentos');   // buscar entregables y documentos
  if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v);
}
document.querySelectorAll('#pestanas [data-vista]').forEach(b => b.onclick = () => mostrarVista(b.dataset.vista));

/* ── Visor: comun/visor-pantalla.js (el mismo de Procesos) ───────────────── */
const abrirVisor = VisorPantalla.abrir;

/* ── Arranque ────────────────────────────────────────────────────────────── */
(async function iniciar() {
  let s = null;
  try { s = await Datos.sesion(); } catch (e) { if (e.codigo === 'sesion') { Datos.aLogin(); return; } }
  Marca.cabecera($('#cab'), { sesion: s, ruta: [{ texto: 'Inicio', url: '/' }, { texto: 'Proyecto Actio' }] });
  const h = location.hash.slice(1);
  if (['entregables', 'documentos', 'reuniones', 'atencion'].includes(h)) vista = h;
  cargar();
})();
</script>
