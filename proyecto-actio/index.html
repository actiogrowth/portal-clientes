<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Proyecto Actio · Vida en Arte</title>
<!-- Proyecto Actio: lo que Actio Growth le entrega a Vida en Arte. Solo
  lectura. Lee SOLO a través de la capa de datos (/comun/datos.js →
  proyecto-actio/api.php), que ya recorta por rol: Dirección nunca recibe
  Proyecto 2. 23-oct: rediseño visual (franja con cifras, entregables en
  filas por unidad, reuniones por mes, acompañamiento con horas por mes). -->
<link rel="stylesheet" href="/comun/vea.css?v=37098cb6a3">
</head>
<body>
<header id="cab"></header>

<!-- Franja negra: qué se ha construido, desde cuándo, y las cuatro cifras. -->
<section class="pa-franja" aria-labelledby="paTitulo">
  <div class="pa-franja-in">
    <div class="pa-franja-fila">
      <div class="pa-franja-tit">
        <span class="pa-sobre">PROYECTO ACTIO</span>
        <h1 class="titulo" id="paTitulo">Lo que hemos construido juntos</h1>
        <span class="pa-desde" id="paSello" aria-live="polite"></span>
      </div>
      <div class="pa-proyectos" id="paProyectos" role="group" aria-label="Proyecto"></div>
    </div>
    <div class="pa-cifras" id="paCifras"></div>
  </div>
</section>

<main class="pagina pa">
  <div class="pa-barra-pestanas">
    <nav class="pestanas" role="tablist" id="pestanas" aria-label="Secciones de Proyecto Actio">
      <button role="tab" data-vista="entregables" aria-selected="true">Entregables</button>
      <button role="tab" data-vista="reuniones" aria-selected="false">Reuniones</button>
      <button role="tab" data-vista="atencion" aria-selected="false">Acompañamiento</button>
    </nav>
    <label class="pa-buscar" id="paBuscarCaja">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="paBuscar" placeholder="Buscar entregable" aria-label="Buscar entregable" autocomplete="off">
    </label>
  </div>

  <div id="pantalla" class="pantalla"><h2>Cargando…</h2><p>Leyendo lo que Actio Growth le ha entregado a Vida en Arte.</p></div>
  <div id="avisos"></div>

  <section id="v-entregables" class="vista oculto columna"><div id="paEntregables" class="columna"></div></section>
  <section id="v-reuniones" class="vista oculto columna"><div id="paReuniones" class="pa-meses"></div></section>
  <section id="v-atencion" class="vista oculto columna">
    <div id="paAcomp" class="pa-acomp"></div>
    <div id="paAtLista" class="pa-lista oculto"></div>
  </section>
</main>

<!-- VISOR: el documento se ve en la misma página. -->
<div class="pa-visor oculto" id="visor" role="dialog" aria-modal="true" aria-labelledby="visorTit">
  <div class="pa-visor-cab">
    <div class="pa-visor-tit"><b id="visorTit"></b><span id="visorSub"></span></div>
    <div class="pa-visor-acciones">
      <a class="btn sec chico" id="visorDescargar" target="_blank" rel="noopener">Descargar</a>
      <button class="btn sec chico" id="visorCompleta" type="button">Pantalla completa</button>
      <button class="btn-circulo" id="visorCerrar" type="button" aria-label="Cerrar el documento">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
  <div class="pestanas pa-versiones" id="visorVersiones" role="tablist" aria-label="Versiones"></div>
  <div class="pa-visor-cuerpo" id="visorCuerpo"></div>
</div>

<script src="/comun/datos.js?v=fe16b3d544"></script>
<script src="/comun/marca.js?v=bc6a4e424f"></script>
<script src="/comun/visor.js?v=7009c9d8cb"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = Marca.esc;
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MESES_LARGOS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const esFecha = iso => /^\d{4}-\d{2}-\d{2}$/.test(iso || '');
const fecha = iso => esFecha(iso) ? +iso.slice(8, 10) + ' ' + MESES[+iso.slice(5, 7) - 1] + ' ' + iso.slice(0, 4) : '';
const mesLargo = k => MESES_LARGOS[+k.slice(5, 7) - 1] + ' ' + k.slice(0, 4);
const decimal = n => (Math.round(n * 10) / 10).toFixed(1).replace('.', ',');   // siempre un decimal: 1,0 · 12,5

/* Cada unidad con su color (texto negro sobre los claros: contraste ≥ 4.5).
   La unidad se muestra como se llama hoy (D-046); el dato no cambia. */
const UNIDADES = {
  kinder:        { nombre: 'Preschool',    ini: 'PS', fondo: '#7E53A2', texto: '#FFFFFF' },
  preschool:     { nombre: 'Preschool',    ini: 'PS', fondo: '#7E53A2', texto: '#FFFFFF' },
  veranito:      { nombre: 'Veranito',     ini: 'VE', fondo: '#FFA615', texto: '#111111' },
  'after school': { nombre: 'After School', ini: 'AS', fondo: '#D71C0E', texto: '#FFFFFF' },
  gerencia:      { nombre: 'Gerencia',     ini: 'GE', fondo: '#111111', texto: '#FFFFFF' },
  cumpleanos:    { nombre: 'Cumpleaños',   ini: 'CU', fondo: '#1974A8', texto: '#FFFFFF' },
  'baby & me':   { nombre: 'Baby & Me',    ini: 'BM', fondo: '#68A8C9', texto: '#111111' },
  'baby and me': { nombre: 'Baby & Me',    ini: 'BM', fondo: '#68A8C9', texto: '#111111' }
};
function unidad(u) {
  const n = String(u || '').trim();
  return UNIDADES[norm(n)] || { nombre: n || 'Sin unidad', ini: (n || '?').slice(0, 2).toUpperCase(), fondo: '#6B6B6B', texto: '#FFFFFF' };
}

/* Estado del entregable en tres palabras. */
function estadoDe(e) {
  const s = norm(e.estado);
  if (s.startsWith('entregad') || s === 'completado' || s === 'hecho') return 'Entregado';
  if (/curso|progreso|proceso|revision/.test(s)) return 'En curso';
  return 'Pendiente';
}

/* Íconos de línea (sin emojis). */
const ICONO = {
  'Documento': '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
  'Presentación': '<path d="M3 4h18v12H3z"/><path d="M8 20h8M12 16v4"/>',
  'Interactiva': '<path d="M4 4l7 17 2-7 7-2z"/>',
  'Minuta': '<path d="M6 3h9l4 4v14H6z"/><path d="M9 13h7M9 17h5"/>',
  'Grabación': '<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>'
};
const icono = k => '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONO[k] || '') + '</svg>';

let D = null, copia = null, proyecto = '', vista = 'entregables', busqueda = '';

function pantalla(html) { $('#pantalla').innerHTML = html; $('#pantalla').classList.remove('oculto'); }

async function cargar() {
  try {
    const j = await Datos.proyectoActio.leer();
    D = j.resultado; copia = j.copia || null;
  } catch (e) {
    if (e.codigo === 'sesion') { Datos.aLogin(); return; }
    pantalla('<h2>No se pudo leer Proyecto Actio</h2><p>La página no muestra nada hasta poder leer los datos, para no dar a entender que no hay entregas.</p><pre>' +
      esc(e.message) + '</pre><button class="btn" id="reintentar" type="button">Reintentar</button>');
    $('#reintentar').onclick = () => { pantalla('<h2>Cargando…</h2>'); cargar(); };
    return;
  }
  if (!D.proyectos.includes(proyecto)) proyecto = D.proyectos[0] || '';
  $('#pantalla').classList.add('oculto');
  pintar();
}

const delProyecto = lista => (lista || []).filter(f => f.proyecto === proyecto);
const soloActio = p => ['entregables', 'documentos', 'reuniones', 'atencion'].some(k => (D[k] || []).some(f => f.proyecto === p && f.soloActio));

function pintar() {
  pintarFranja();
  $('#avisos').innerHTML = (D.faltan || []).length
    ? '<div class="aviso ojo">En el Sheet faltan columnas o pestañas: ' + esc(D.faltan.join(' · ')) + '. Esas partes salen vacías.</div>' : '';
  pintarEntregables(); pintarReuniones(); pintarAcompanamiento();
  mostrarVista(vista);
}

/* ── Franja: desde cuándo, datos al, selector y cuatro cifras ────────────── */
function pintarFranja() {
  const es = delProyecto(D.entregables), rs = delProyecto(D.reuniones), as = delProyecto(D.atencion);
  const fechas = [].concat(es.map(e => e.fechaReal), es.map(e => e.fechaCompromiso), delProyecto(D.documentos).map(d => d.fecha),
    rs.map(r => r.fecha), as.map(a => a.fecha)).filter(esFecha).sort();
  const gen = D.generado ? new Date(D.generado) : null;
  const partes = [];
  if (fechas.length) partes.push('Desde ' + mesLargo(fechas[0]).replace(' ', ' de '));
  if (gen && !isNaN(gen)) partes.push('datos al ' + gen.getDate() + ' de ' + MESES_LARGOS[gen.getMonth()] +
    (copia && copia.segundos > 60 ? ' (copia de hace ' + Math.round(copia.segundos / 60) + ' min)' : ''));
  $('#paSello').textContent = partes.join(' · ');

  $('#paProyectos').innerHTML = D.proyectos.length > 1 || D.proyectos.some(soloActio)
    ? D.proyectos.map(p => '<button type="button" aria-pressed="' + (p === proyecto) + '" data-proyecto="' + esc(p) + '">' + esc(p) +
        (soloActio(p) ? ' · Solo Actio' : '') + '</button>').join('')
    : (proyecto ? '<span class="pa-proy-unico">' + esc(proyecto) + '</span>' : '');
  $('#paProyectos').querySelectorAll('[data-proyecto]').forEach(b => b.onclick = () => { proyecto = b.dataset.proyecto; pintar(); });

  const hechos = es.filter(e => estadoDe(e) === 'Entregado').length;
  const pct = es.length ? Math.round(hechos / es.length * 100) : 0;
  const unidades = new Set(es.map(e => unidad(e.unidad).nombre)).size;
  const minutos = as.reduce((t, a) => t + (+a.duracionMin || 0), 0);
  const cifra = (clase, n, texto) => '<div class="pa-cifra ' + clase + '"><span class="titulo num">' + n + '</span><span>' + texto + '</span></div>';
  $('#paCifras').innerHTML =
    cifra('c-rojo', es.length, (es.length === 1 ? 'entregable' : 'entregables') + ', ' + pct + ' % ' + (es.length === 1 ? 'entregado' : 'entregados')) +
    cifra('c-naranja', unidades, unidades === 1 ? 'unidad de negocio' : 'unidades de negocio') +
    cifra('c-azul', rs.length, rs.length === 1 ? 'reunión de trabajo' : 'reuniones de trabajo') +
    cifra('c-blanco', decimal(minutos / 60) + ' h', 'de acompañamiento directo');
}

/* ── Entregables: filas agrupadas por unidad ─────────────────────────────── */
function docsDe(e) { return D.documentos.filter(d => d.idEntregable && d.idEntregable === e.id && d.proyecto === e.proyecto); }

function pintarEntregables() {
  const todos = delProyecto(D.entregables);
  const q = norm(busqueda);
  const vistos = todos.filter(e => !q || norm(e.entregable + ' ' + e.segmento + ' ' + unidad(e.unidad).nombre).includes(q));
  if (!todos.length) { $('#paEntregables').innerHTML = '<div class="tarjeta"><p class="ayuda">Este proyecto todavía no tiene entregables.</p></div>'; return; }
  if (!vistos.length) { $('#paEntregables').innerHTML = '<div class="tarjeta"><p class="ayuda">Ningún entregable coincide con «' + esc(busqueda) + '».</p></div>'; return; }
  const nombres = [...new Set(vistos.map(e => unidad(e.unidad).nombre))];
  $('#paEntregables').innerHTML = nombres.map(nom => {
    const es = vistos.filter(e => unidad(e.unidad).nombre === nom), u = unidad(es[0].unidad);
    return '<section class="pa-unidad">' +
      '<div class="pa-unidad-cab"><span class="pa-insignia" style="background:' + u.fondo + ';color:' + u.texto + '" aria-hidden="true">' + esc(u.ini) + '</span>' +
      '<h2 class="titulo">' + esc(u.nombre) + '</h2><span class="ayuda">' + es.length + (es.length === 1 ? ' entregable' : ' entregables') + '</span><i aria-hidden="true"></i></div>' +
      '<div class="pa-filas">' + es.map(filaEntregable).join('') + '</div></section>';
  }).join('');
  $('#paEntregables').querySelectorAll('[data-abrir]').forEach(b => b.onclick = () => {
    const e = D.entregables.find(x => x.id === b.dataset.abrir && x.proyecto === proyecto);
    abrirVisor(e.entregable, unidad(e.unidad).nombre + (e.segmento ? ' · ' + e.segmento : ''), Visor.versiones(docsDe(e)), b.dataset.version);
  });
}

function filaEntregable(e) {
  const est = estadoDe(e), vs = Visor.versiones(docsDe(e));
  const cuando = est === 'Entregado' ? fecha(e.fechaReal) : (e.fechaCompromiso ? 'compromiso ' + fecha(e.fechaCompromiso) : 'sin fecha');
  const sub = [e.segmento, cuando].filter(Boolean).join(' · ');
  return '<div class="pa-fila-e">' +
    '<div class="pa-fila-e-txt"><span class="pa-fila-e-nom">' + esc(e.entregable) +
      (est !== 'Entregado' ? ' <span class="chip ' + (est === 'En curso' ? 'pa-curso' : 'pa-pend') + '">' + est + (est === 'En curso' && e.avance ? ' · ' + esc(e.avance) + ' %' : '') + '</span>' : '') +
    '</span>' + (sub ? '<span class="ayuda">' + esc(sub) + '</span>' : '') + '</div>' +
    '<div class="pa-versiones-fila">' + (vs.length ? vs.map(v =>
      '<button type="button" class="pa-boton" data-abrir="' + esc(e.id) + '" data-version="' + esc(v.version) + '">' + icono(v.version) + esc(v.version) + '</button>').join('')
      : '<span class="pa-por-cargar">Documento por cargar</span>') + '</div>' +
    '</div>';
}
$('#paBuscar').addEventListener('input', () => { busqueda = $('#paBuscar').value; pintarEntregables(); });

/* ── Reuniones: por mes, fecha en forma de calendario ────────────────────── */
function pintarReuniones() {
  const rs = delProyecto(D.reuniones).slice().sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
  if (!rs.length) { $('#paReuniones').innerHTML = '<div class="tarjeta"><p class="ayuda">No hay reuniones registradas en este proyecto.</p></div>'; return; }
  const meses = [];
  rs.forEach(r => { const k = esFecha(r.fecha) ? r.fecha.slice(0, 7) : ''; let m = meses.find(x => x.k === k); if (!m) meses.push(m = { k, items: [] }); m.items.push(r); });
  $('#paReuniones').innerHTML = meses.map(m =>
    '<div class="pa-mes"><div class="pa-mes-cab"><span class="pa-mes-nom">' + (m.k ? mesLargo(m.k) : 'Sin fecha') + '</span>' +
    '<span class="ayuda">' + m.items.length + (m.items.length === 1 ? ' reunión' : ' reuniones') + '</span><i aria-hidden="true"></i></div>' +
    m.items.map(r => {
      const i = rs.indexOf(r);
      return '<div class="pa-reu">' +
        (esFecha(r.fecha) ? '<div class="pa-cal" aria-label="' + esc(fecha(r.fecha)) + '"><span class="titulo">' + +r.fecha.slice(8, 10) + '</span><span>' + MESES[+r.fecha.slice(5, 7) - 1] + '</span></div>'
          : '<div class="pa-cal"><span>—</span></div>') +
        '<span class="pa-reu-tema">' + esc(r.tema) + '</span>' +
        '<div class="pa-versiones-fila">' +
          (Visor.vista(r.minuta).modo !== 'nada' ? '<button class="pa-boton" type="button" data-reu="' + i + '" data-que="minuta">' + icono('Minuta') + 'Minuta</button>' : '') +
          (Visor.vista(r.grabacion).modo !== 'nada' ? '<button class="pa-boton" type="button" data-reu="' + i + '" data-que="grabacion">' + icono('Grabación') + 'Grabación</button>' : '') +
        '</div></div>';
    }).join('') + '</div>').join('');
  $('#paReuniones').querySelectorAll('[data-reu]').forEach(b => b.onclick = () => {
    const r = rs[+b.dataset.reu], minuta = b.dataset.que === 'minuta';
    abrirVisor(r.tema, fecha(r.fecha), [{ version: minuta ? 'Minuta' : 'Grabación', nombre: r.tema, enlace: minuta ? r.minuta : r.grabacion }]);
  });
}

/* ── Acompañamiento: totales, horas por mes y el detalle desplegable ─────── */
function pintarAcompanamiento() {
  const as = delProyecto(D.atencion).slice().sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
  if (!as.length) {
    $('#paAcomp').innerHTML = '<div class="tarjeta"><p class="ayuda">No hay acompañamiento directo registrado en este proyecto.</p></div>';
    $('#paAtLista').innerHTML = ''; return;
  }
  const meses = {};
  as.forEach(a => { if (!esFecha(a.fecha)) return; const k = a.fecha.slice(0, 7); (meses[k] = meses[k] || { n: 0, min: 0 }); meses[k].n++; meses[k].min += +a.duracionMin || 0; });
  // Todos los meses entre el primero y el último, aunque alguno no tenga encuentros (barra en cero).
  const ks = Object.keys(meses).sort(), serie = [];
  if (ks.length) for (let y = +ks[0].slice(0, 4), m = +ks[0].slice(5, 7); ; ) {
    const k = y + '-' + String(m).padStart(2, '0'); serie.push({ k, n: (meses[k] || {}).n || 0, h: ((meses[k] || {}).min || 0) / 60 });
    if (k === ks[ks.length - 1]) break; if (++m > 12) { m = 1; y++; }
  }
  const maxH = Math.max(...serie.map(s => s.h), 0.1);
  const totalMin = as.reduce((t, a) => t + (+a.duracionMin || 0), 0);
  $('#paAcomp').innerHTML =
    '<div class="pa-acomp-tot">' +
      '<div><span class="titulo num">' + decimal(totalMin / 60) + ' h</span><span class="ayuda">llamadas y reuniones</span></div>' +
      '<div><span class="titulo num">' + as.length + '</span><span class="ayuda">' + (as.length === 1 ? 'encuentro' : 'encuentros') + '</span></div>' +
    '</div>' +
    '<figure class="pa-grafico"><figcaption>Horas por mes</figcaption>' +
      '<div class="pa-barras" role="list">' + serie.map(s =>
        '<div class="pa-barra-col" role="listitem" tabindex="0" title="' + esc(mesLargo(s.k) + ': ' + decimal(s.h) + ' h en ' + s.n + (s.n === 1 ? ' encuentro' : ' encuentros')) + '"' +
          ' aria-label="' + esc(mesLargo(s.k) + ': ' + decimal(s.h) + ' horas, ' + s.n + (s.n === 1 ? ' encuentro' : ' encuentros')) + '">' +
          '<span class="pa-barra-val num">' + decimal(s.h) + '</span>' +
          '<i style="height:' + (s.h ? Math.max(3, Math.round(s.h / maxH * 130)) : 0) + 'px"></i>' +
          '<span class="pa-barra-mes">' + MESES[+s.k.slice(5, 7) - 1] + '</span>' +
          '<span class="pa-globo" aria-hidden="true">' + esc(mesLargo(s.k)) + '<b>' + decimal(s.h) + ' h · ' + s.n + (s.n === 1 ? ' encuentro' : ' encuentros') + '</b></span>' +
        '</div>').join('') + '</div></figure>' +
    '<button class="btn sec" type="button" id="paVerDetalle" aria-expanded="false" aria-controls="paAtLista">Ver el detalle de cada encuentro</button>';
  $('#paAtLista').innerHTML = as.map(a =>
    '<div class="pa-fila"><div class="pa-fecha num">' + esc(fecha(a.fecha) || 'Sin fecha') + '</div>' +
    '<div class="pa-fila-txt"><b>' + esc(a.asunto || a.tipo) + '</b><span class="ayuda">' + esc(a.tipo) +
      (a.duracionMin ? ' · ' + esc(a.duracionMin) + ' min' : '') + (a.unidad ? ' · ' + esc(unidad(a.unidad).nombre) : '') + '</span></div>' +
    '<div class="pa-fila-acc">' + (Visor.vista(a.enlace).modo !== 'nada' ? '<a class="btn sec chico" href="' + esc(a.enlace) + '" target="_blank" rel="noopener">Abrir</a>' : '') + '</div></div>').join('');
  $('#paAtLista').classList.add('oculto');
  $('#paVerDetalle').onclick = () => {
    const abrir = $('#paAtLista').classList.contains('oculto');
    $('#paAtLista').classList.toggle('oculto', !abrir);
    $('#paVerDetalle').setAttribute('aria-expanded', String(abrir));
    $('#paVerDetalle').textContent = abrir ? 'Ocultar el detalle' : 'Ver el detalle de cada encuentro';
  };
}

/* ── Pestañas ────────────────────────────────────────────────────────────── */
function mostrarVista(v) {
  vista = v;
  document.querySelectorAll('#pestanas [data-vista]').forEach(b => b.setAttribute('aria-selected', b.dataset.vista === v ? 'true' : 'false'));
  document.querySelectorAll('.vista').forEach(s => s.classList.toggle('oculto', !D || s.id !== 'v-' + v));
  $('#paBuscarCaja').classList.toggle('oculto', v !== 'entregables');   // el buscador es de Entregables
  if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v);
}
document.querySelectorAll('#pestanas [data-vista]').forEach(b => b.onclick = () => mostrarVista(b.dataset.vista));

/* ── Visor ───────────────────────────────────────────────────────────────── */
let versionesVisor = [], volverFoco = null;
/* Abre el visor en la versión pedida (1 clic desde la fila); las demás quedan
   como pestañas. Un enlace que no se puede incrustar se abre en pestaña nueva. */
function abrirVisor(titulo, sub, versiones, pedida) {
  versionesVisor = versiones.filter(v => Visor.vista(v.enlace).modo !== 'nada');
  if (!versionesVisor.length) return;
  const i = Math.max(0, versionesVisor.findIndex(v => v.version === pedida));
  if (Visor.vista(versionesVisor[i].enlace).modo === 'nueva') { window.open(versionesVisor[i].enlace, '_blank', 'noopener'); return; }
  volverFoco = document.activeElement;
  $('#visorTit').textContent = titulo; $('#visorSub').textContent = sub || '';
  $('#visorVersiones').innerHTML = versionesVisor.length > 1 ? versionesVisor.map((v, k) =>
    '<button role="tab" type="button" data-v="' + k + '">' + esc(v.version) + '</button>').join('') : '';
  $('#visorVersiones').querySelectorAll('[data-v]').forEach(b => b.onclick = () => verVersion(+b.dataset.v));
  $('#visor').classList.remove('oculto'); document.body.classList.add('pa-visor-abierto');
  verVersion(i);
  $('#visorCerrar').focus();
}
function verVersion(i) {
  const v = versionesVisor[i], x = Visor.vista(v.enlace), des = Visor.descarga(v.enlace);
  $('#visorVersiones').querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-selected', +b.dataset.v === i ? 'true' : 'false'));
  $('#visorDescargar').classList.toggle('oculto', !des);
  if (des) $('#visorDescargar').href = des;
  $('#visorCompleta').classList.toggle('oculto', x.modo !== 'incrustar' || !document.fullscreenEnabled);
  $('#visorCuerpo').innerHTML = x.modo === 'incrustar'
    ? '<iframe src="' + esc(x.url) + '" title="' + esc(v.version + ': ' + (v.nombre || '')) + '" allow="fullscreen; autoplay" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>'
    : '<div class="pantalla"><h2>' + esc(v.version) + '</h2><p>Este enlace no se puede mostrar dentro del portal: se abre en una pestaña nueva.</p>' +
      '<a class="btn negro" href="' + esc(x.url) + '" target="_blank" rel="noopener">Abrir en una pestaña nueva</a></div>';
}
function cerrarVisor() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  $('#visor').classList.add('oculto'); document.body.classList.remove('pa-visor-abierto');
  $('#visorCuerpo').innerHTML = '';
  if (volverFoco) volverFoco.focus();
}
$('#visorCerrar').onclick = cerrarVisor;
$('#visorCompleta').onclick = () => { const f = $('#visorCuerpo'); if (f.requestFullscreen) f.requestFullscreen().catch(() => {}); };
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#visor').classList.contains('oculto') && !document.fullscreenElement) cerrarVisor(); });

/* ── Arranque ────────────────────────────────────────────────────────────── */
(async function iniciar() {
  let s = null;
  try { s = await Datos.sesion(); } catch (e) { if (e.codigo === 'sesion') { Datos.aLogin(); return; } }
  Marca.cabecera($('#cab'), { sesion: s, ruta: [{ texto: 'Inicio', url: '/' }, { texto: 'Proyecto Actio' }] });
  const h = location.hash.slice(1);
  if (['entregables', 'reuniones', 'atencion'].includes(h)) vista = h;
  cargar();
})();
</script>
