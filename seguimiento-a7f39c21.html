<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Seguimiento interno · Actio Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   PANEL INTERNO DE SEGUIMIENTO

   Vista para la reunion semanal de Actio. No es el portal del cliente.

   Los tokens de abajo son una copia de los de portal-v2.html, que es la
   fuente de verdad de la marca. Se duplican a proposito: los dos
   archivos son autocontenidos y no comparten hoja de estilos. Si se
   cambia un color en el portal, hay que traerlo aqui a mano.
   ========================================================================== */
:root{
  /* ---------- Marca Actio ---------- */
  --marca-verde-profundo:#004225;
  --marca-verde-medio:#355E3B;
  --marca-verde-claro:#4C6B47;
  --marca-gris-claro:#F5F5F0;

  --texto-principal:#1A1A1A;
  --texto-secundario:#6B6B6B;
  --texto-sobre-oscuro:#FFFFFF;
  --texto-sobre-oscuro-2:rgba(255,255,255,.55);
  --texto-sobre-oscuro-3:rgba(255,255,255,.66);

  --marca-tenue:#EDF2EE;
  --marca-borde-suave:#C9D6CC;
  --marca-realce:rgba(0,66,37,.06);
  --marca-sombra:rgba(0,66,37,.10);
  --marca-sombra-fuerte:rgba(0,66,37,.16);

  /* ---------- Estados funcionales ----------
     Semaforo. El verde de marca no entra aqui y ninguno de estos se usa
     como decoracion. */
  --estado-en-meta:#2E9E5B;
  --estado-en-meta-suave:#E4F6EB;
  --estado-en-meta-fuerte:#1B6E3C;

  --estado-atencion:#C77F1A;
  --estado-atencion-suave:#FDF0DC;
  --estado-atencion-fuerte:#8A5A00;

  --estado-riesgo:#D1453B;
  --estado-riesgo-suave:#FBE3E1;
  --estado-riesgo-fuerte:#93231B;

  --estado-neutro:#82888E;
  --estado-neutro-suave:#ECEDEA;
  --estado-neutro-fuerte:#5A5A5A;

  /* ---------- Superficies ---------- */
  --fondo:var(--marca-gris-claro);
  --superficie:#FFFFFF;
  --superficie-sutil:#FAFAF7;
  --borde:#E3E3DD;
  --borde-suave:#EFEFE9;

  --font:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--fondo);color:var(--texto-principal);
  font-weight:300;line-height:1.6;font-size:14px}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px 60px}

header{display:flex;align-items:center;gap:16px;background:var(--superficie);
  border:1px solid var(--borde);border-radius:14px;padding:15px 22px;margin:22px 0 18px}
header img{height:36px;display:block}
.h-sep{align-self:stretch;border-left:1px solid var(--marca-verde-claro);margin-left:15px}
.h-title{font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px}
.h-sello{margin-left:auto;font-size:11px;color:var(--texto-secundario);
  background:var(--superficie);border:1px solid var(--borde);border-radius:999px;
  padding:8px 15px;white-space:nowrap}

/* Bloque generico. Los de arriba se proyectan, asi que su tipografia
   sube de cuerpo en las reglas de cada bloque. */
.bloque{background:var(--superficie);border:1px solid var(--borde);
  border-radius:14px;padding:22px 24px;margin-bottom:14px}
.bloque-t{font-size:10px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--texto-secundario);margin-bottom:16px}

/* Fuente caida. Nunca un cero en su lugar: un cero se leeria como
   "todo en verde", que es exactamente la lectura contraria. */
.sin-dato{background:var(--estado-neutro-suave);color:var(--estado-neutro-fuerte);
  border-radius:10px;padding:16px 18px;font-size:13px}
.sin-dato b{color:var(--texto-principal);font-weight:600}
.cargando{color:var(--texto-secundario);font-size:13px;padding:8px 0}

/* Bloques 1 a 4: se proyectan, asi que el cuerpo sube para leerse a
   tres metros. El bloque 5 se queda en tamaño de lectura. */
.sem{display:flex;align-items:center;gap:18px}
.sem-luz{width:34px;height:34px;border-radius:50%;flex-shrink:0}
.sem-rotulo{font-size:38px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.sem-en-meta .sem-luz{background:var(--estado-en-meta)}
.sem-en-meta .sem-rotulo{color:var(--estado-en-meta-fuerte)}
.sem-atencion .sem-luz{background:var(--estado-atencion)}
.sem-atencion .sem-rotulo{color:var(--estado-atencion-fuerte)}
.sem-riesgo .sem-luz{background:var(--estado-riesgo)}
.sem-riesgo .sem-rotulo{color:var(--estado-riesgo-fuerte)}
.sem-ctx{margin-top:12px;font-size:17px;color:var(--texto-secundario)}

.personas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.persona{background:var(--superficie-sutil);border:1px solid var(--borde);
  border-radius:12px;padding:16px 18px;cursor:pointer;transition:.15s}
.persona:hover{border-color:var(--marca-verde-claro)}
.persona.on{border-color:var(--marca-verde-profundo);border-width:2px;background:var(--marca-tenue)}
.persona-n{font-size:15px;font-weight:600;margin-bottom:10px}
.persona-cifras{display:flex;gap:26px}
.pc{display:flex;flex-direction:column}
.pc-v{font-size:36px;font-weight:700;line-height:1;letter-spacing:-1px}
.pc-e{font-size:11px;color:var(--texto-secundario);margin-top:3px}
/* Las vencidas se destacan, no se dramatizan: cambia el color de la
   cifra y nada mas. Sin barras, sin comparaciones entre tarjetas. */
.pc-alerta .pc-v{color:var(--estado-riesgo)}

.pie{border-top:1px solid var(--borde);margin-top:26px;padding-top:18px;
  font-size:11px;color:var(--texto-secundario);line-height:1.9}

@media(max-width:820px){
  .personas{grid-template-columns:1fr}
}
@media(max-width:640px){
  header{flex-wrap:wrap;gap:12px;padding:14px 16px}
  .h-sep{display:none}
  .h-sello{margin-left:0;flex-basis:100%;max-width:max-content}
  .bloque{padding:18px 16px}
  .sem-rotulo{font-size:28px}
  .sem-ctx{font-size:15px}
  .pc-v{font-size:30px}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img src="logo-actio-verde.png" alt="Actio Growth">
    <div class="h-sep"></div>
    <div class="h-title">Seguimiento interno</div>
    <div class="h-sello" id="sello">Cargando…</div>
  </header>

  <div class="bloque" id="b-semaforo"><div class="cargando">Cargando semáforo…</div></div>
  <div class="bloque" id="b-personas"><div class="cargando">Cargando carga por persona…</div></div>
  <div class="bloque" id="b-entregables"><div class="cargando">Cargando entregables…</div></div>
  <div class="bloque" id="b-cumplimiento"><div class="cargando">Cargando cumplimiento…</div></div>
  <div class="bloque" id="b-detalle"><div class="cargando">Cargando detalle…</div></div>

  <div class="pie" id="pie"></div>
</div>

<script>
const BASE="https://docs.google.com/spreadsheets/d/e/2PACX-1vSAFz6KtU3Cs7Ty7TFH9r2Xs8CfDiAjqveR0YbS71XljM9p3QDxIkwIHcmR_5khJUmsHvFcSP96zCXS";
const CSV_RESUMEN=BASE+"/pub?gid=214293326&single=true&output=csv";
const CSV_DETALLE=BASE+"/pub?gid=1895614511&single=true&output=csv";
const CSV_RIESGO =BASE+"/pub?gid=0&single=true&output=csv";

/* null mientras no se sepa nada, false si la fuente fallo, y el dato
   cuando llega. Distinguir los tres estados es lo que permite avisar en
   vez de pintar ceros. */
let RESUMEN=null,DETALLE=null,RIESGO=null;
let filtroPersona="Todos";

const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

/* ============ LECTURA ============ */
/* Mismo parser que el portal: comillas, comas dentro de campo y saltos
   de linea dentro de celda. */
function parseCSV(t){
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cur);cur=""; }
    else if(c==="\n"){ row.push(cur);rows.push(row);row=[];cur=""; }
    else if(c!=="\r") cur+=c;
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function filas(txt){
  return parseCSV(txt).filter(r=>r.length>1&&r.join("").trim()!=="");
}
function tabla(txt){
  const rows=filas(txt);
  if(!rows.length) return {head:[],rows:[]};
  const head=rows.shift().map(h=>h.trim());
  return {head,rows};
}
function col(head,nombre){
  return head.findIndex(h=>h.toLowerCase().trim()===nombre.toLowerCase());
}
function fecha(s){
  if(!s)return null;
  const m=String(s).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m?new Date(+m[3],+m[2]-1,+m[1]):null;
}
function fmt(d){ return d? d.getDate()+" "+MES[d.getMonth()]+" "+d.getFullYear() : "—"; }
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function hoy(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
/* Dias enteros entre dos fechas, positivo si la primera ya paso. */
function diasDesde(d){ return Math.round((hoy()-d)/86400000); }

/* El CSV de Resumen no trae fila de cabecera: su primera fila ya es un
   dato. Por eso se lee con filas() y no con tabla(), que se comeria la
   primera metrica. */
function leerResumen(txt){
  /* valores lleva la busqueda por clave normalizada; orden conserva las
     etiquetas tal cual vienen, que es de donde salen los nombres de los
     socios sin escribirlos en el codigo. */
  const out={valores:{},orden:[]};
  filas(txt).forEach(r=>{
    const k=(r[0]||"").trim();
    if(!k) return;
    const v=parseFloat(String(r[1]||"").replace(",","."));
    out.valores[k.toLowerCase()]=isNaN(v)?null:v;
    out.orden.push(k);
  });
  return out.orden.length?out:false;
}
/* Devuelve null si la metrica no existe, para poder distinguir
   "no vino" de "vino en cero". */
function metrica(nombre){
  if(!RESUMEN) return null;
  const v=RESUMEN.valores[nombre.toLowerCase()];
  return (v===undefined)?null:v;
}

/* Los socios salen de las propias metricas: toda etiqueta que empiece
   por "Activas " nombra a uno. Asi no hay una lista de personas escrita
   en el codigo y el panel se adapta si entra o sale alguien. */
function socios(){
  if(!RESUMEN) return [];
  const out=[];
  RESUMEN.orden.forEach(et=>{
    const m=et.match(/^Activas\s+(.+)$/i);
    if(m && out.indexOf(m[1].trim())<0) out.push(m[1].trim());
  });
  return out;
}

function leerDetalle(txt){
  const t=tabla(txt),h=t.head;
  const cId=col(h,"ID"),cCli=col(h,"Cliente"),cTar=col(h,"Tarea"),cDep=col(h,"Departamento"),
        cRes=col(h,"Responsable"),cEst=col(h,"Estado"),cAv=col(h,"Avance"),
        cFc=col(h,"Fecha compromiso"),cFo=col(h,"Foco");
  const filas2=t.rows.map(r=>({
    id:(r[cId]||"").trim(), cliente:(r[cCli]||"").trim(), tarea:(r[cTar]||"").trim(),
    depto:(cDep>=0?(r[cDep]||"").trim():""), responsable:(r[cRes]||"").trim(),
    estado:(r[cEst]||"").trim(), avance:(cAv>=0?(r[cAv]||"").trim():""),
    compromiso:fecha(r[cFc]), foco:(cFo>=0?(r[cFo]||"").trim():"")
  })).filter(d=>d.tarea);
  return filas2.length?filas2:false;
}

function leerRiesgo(txt){
  const t=tabla(txt),h=t.head;
  const cU=col(h,"Unidad"),cE=col(h,"Entregable"),cEst=col(h,"Estado"),
        cAv=col(h,"Avance"),cFc=col(h,"Fecha compromiso"),cT=col(h,"Tareas");
  const filas2=t.rows.map(r=>({
    unidad:(r[cU]||"").trim(), entregable:(r[cE]||"").trim(),
    estado:(cEst>=0?(r[cEst]||"").trim():""), avance:(cAv>=0?(r[cAv]||"").trim():""),
    compromiso:fecha(r[cFc]), tareas:(cT>=0?(r[cT]||"").trim():"")
  })).filter(d=>d.entregable);
  /* Una lista vacia es un dato valido —no hay nada comprometido— y no
     un fallo, asi que se devuelve el array aunque venga sin filas. */
  return filas2;
}

/* ============ CARGA ============ */
/* Cada fuente falla por su cuenta: si cae una, las demas siguen. */
function traer(url,parsear){
  return fetch(url)
    .then(r=>{if(!r.ok)throw new Error(r.status);return r.text();})
    .then(txt=>{const d=parsear(txt); return (d===false||d===null||d===undefined)?false:d;})
    .catch(()=>false);
}

function avisoSinDato(que){
  return '<div class="sin-dato"><b>Sin información disponible.</b> No se pudo leer '+que+
         '. Los datos que faltan no se muestran como cero para no dar una lectura falsa.</div>';
}

function pintarTodo(){
  pintarSemaforo();
  pintarPersonas();
  pintarEntregables();
  pintarCumplimiento();
  pintarDetalle();
  pintarPie();
  document.getElementById("sello").textContent="Actualizado "+fmt(new Date());
}

Promise.all([
  traer(CSV_RESUMEN,leerResumen).then(d=>RESUMEN=d),
  traer(CSV_DETALLE,leerDetalle).then(d=>DETALLE=d),
  traer(CSV_RIESGO ,leerRiesgo ).then(d=>RIESGO=d)
]).then(pintarTodo);

/* ============ BLOQUES ============
   Los bloques 1 a 5 llegan en los commits siguientes. Por ahora cada uno
   declara si su fuente esta disponible, que es lo que permite verificar
   el manejo de fallos antes de construir encima.

   El titulo del bloque y la frase del aviso son cosas distintas y van
   por separado. El titulo es un antetitulo y va sin articulo, como los
   del portal; la frase vive dentro de una oracion y lo necesita.
   El titulo se dibuja tambien cuando la fuente falla: si no, el bloque
   caido pierde su identidad y no se sabe cual es. */
function estadoFuente(id,dato,titulo,queFallo){
  document.getElementById(id).innerHTML=
    '<div class="bloque-t">'+titulo+'</div>'+
    ((dato===false)?avisoSinDato(queFallo)
      :'<div class="cargando">Fuente disponible. Bloque pendiente.</div>');
}
/* Separa los comprometidos comparando con hoy. La pestaña Riesgo los
   trae juntos; vencido es incumplimiento y en riesgo todavia se salva. */
function partirEntregables(){
  if(!RIESGO) return null;
  const v=[],r=[];
  RIESGO.forEach(e=>{
    if(!e.compromiso){ r.push(e); return; }
    (diasDesde(e.compromiso)>0?v:r).push(e);
  });
  return {vencidos:v,enRiesgo:r};
}

function tareasVencidas(){
  const s=socios();
  if(!s.length) return null;
  let t=0;
  for(const p of s){ const n=metrica("Vencidas "+p); if(n===null) return null; t+=n; }
  return t;
}

/* El semaforo necesita las dos fuentes. Sin alguna no se puede decir
   verde, que es justo la afirmacion peligrosa: mejor callar. */
function pintarSemaforo(){
  const el=document.getElementById("b-semaforo");
  const partes=partirEntregables(), vencidas=tareasVencidas();
  if(partes===null||vencidas===null){
    el.innerHTML='<div class="bloque-t">Semáforo general</div>'+
      avisoSinDato(partes===null?"la lista de entregables comprometidos":"el resumen");
    return;
  }
  const nv=partes.vencidos.length, nr=partes.enRiesgo.length;
  let nivel,rotulo;
  if(nv+nr>0){ nivel="riesgo"; rotulo="Hay que atender"; }
  else if(vencidas>0){ nivel="atencion"; rotulo="Con tareas vencidas"; }
  else { nivel="en-meta"; rotulo="Sin nada pendiente"; }
  const trozos=[];
  if(nv) trozos.push(nv+(nv===1?" entregable vencido":" entregables vencidos"));
  if(nr) trozos.push(nr+" en riesgo");
  trozos.push(vencidas+(vencidas===1?" tarea vencida":" tareas vencidas"));
  el.innerHTML='<div class="bloque-t">Semáforo general</div>'+
    '<div class="sem sem-'+nivel+'"><span class="sem-luz"></span>'+
    '<span class="sem-rotulo">'+rotulo+'</span></div>'+
    '<div class="sem-ctx">'+trozos.join(" · ")+'</div>';
}

function pintarPersonas(){
  const el=document.getElementById("b-personas");
  const s=socios();
  if(!RESUMEN||!s.length){
    el.innerHTML='<div class="bloque-t">Carga por persona</div>'+avisoSinDato("el resumen");
    return;
  }
  /* Sin barras comparativas ni orden que insinue ranking: se respeta el
     orden en que vienen del Sheet. El panel informa; interpretar es de
     la reunion. */
  let h='<div class="bloque-t">Carga por persona</div><div class="personas">';
  s.forEach(p=>{
    const a=metrica("Activas "+p), v=metrica("Vencidas "+p);
    const sel=(filtroPersona===p)?" on":"";
    h+='<div class="persona'+sel+'" data-p="'+esc(p)+'" role="button" tabindex="0"'+
       ' aria-pressed="'+(filtroPersona===p)+'">'+
       '<div class="persona-n">'+esc(p)+'</div>'+
       '<div class="persona-cifras">'+
         '<div class="pc"><span class="pc-v">'+(a===null?"—":a)+'</span><span class="pc-e">activas</span></div>'+
         '<div class="pc'+(v?" pc-alerta":"")+'"><span class="pc-v">'+(v===null?"—":v)+'</span><span class="pc-e">vencidas</span></div>'+
       '</div></div>';
  });
  el.innerHTML=h+'</div>';
  el.querySelectorAll(".persona").forEach(c=>{
    const activar=()=>{
      filtroPersona=(filtroPersona===c.dataset.p)?"Todos":c.dataset.p;
      pintarPersonas(); pintarDetalle();
    };
    c.onclick=activar;
    c.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); activar(); } };
  });
}
function pintarEntregables(){ estadoFuente("b-entregables",RIESGO,"Entregables comprometidos","la lista de entregables comprometidos"); }
function pintarCumplimiento(){ estadoFuente("b-cumplimiento",RESUMEN,"Cumplimiento de la semana","el resumen"); }
function pintarDetalle(){ estadoFuente("b-detalle",DETALLE,"Detalle de tareas","el detalle de tareas"); }
function pintarPie(){ document.getElementById("pie").innerHTML=""; }
</script>
</body>
</html>
